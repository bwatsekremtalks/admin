    err: { nom: 'Ekri non w (omwen 2 karaktè).', message: 'Ekri mesaj ou (omwen 5 karaktè).', lien: 'Lyen pa otorize.', vit: 'Tann kèk segonn anvan w voye ankò.', double: 'Avi sa a deja voye.', note: 'Nòt la pa bon.', x: 'Li pa t ka ale. Eseye ankò.' },
    ago: (m) => (m < 1 ? 'kounye a' : m < 60 ? `sa gen ${m} min` : m < 1440 ? `sa gen ${Math.floor(m / 60)} è` : `sa gen ${Math.floor(m / 1440)} jou`) },
  en: { kick: 'Your feedback', title: 'Tell us what you <em>think.</em>', lead: 'Your feedback shapes the conversations to come. Appreciation, encouragement or suggestion: share your opinion on Bwat Sekrèm Talks freely.',
    avis: ['review received', 'reviews received'], first: 'Your turn!', firstS: 'Be the first to share your feedback', s2: '2 min', s2s: 'are enough to share yours', s3: '100%', s3s: 'of messages read by the team',
    who: (a, b, n) => (!b ? `${a} has already shared feedback.` : !n ? `${a} and ${b} have already shared theirs.` : `${a}, ${b} and ${n} other${n > 1 ? 's' : ''} have already shared theirs.`) + ' Your turn!',
    fT: 'Share your feedback', fS: 'In 2 minutes · no sign-up',
    nom: 'Your name', profil: 'You are', note: 'Your rating', opt: '(optional)', msg: 'Your message', msgPh: 'What you liked, what you expect from the event, a suggestion…',
    rate0: 'Tap a star', rates: ['', 'Could be better 😕', 'Average 😐', 'Good 🙂', 'Very good 😃', 'Excellent! 🤩'],
    ideas: [['👍', 'What I liked', 'What I liked: '], ['🎤', 'The speakers', 'About the speakers: '], ['🗂️', 'The organisation', 'About the organisation: '], ['💡', 'A suggestion', 'My suggestion: '], ['🙏', 'An encouragement', 'A word for the team: ']],
    pub: 'I agree that my feedback (first and last name) may be shown on the Bwat Sekrèm Talks website.', pub2: 'Untick the box to keep it for the team only.', send: 'Send my feedback  →', sending: 'Sending…', safe: '🔒 No account, no e-mail required.',
    P: ['Student', 'Professional', 'Entrepreneur', 'Partner', 'Volunteer', 'Other'], choose: '— Choose —',
    lT: 'What they say', pubN: ['published review', 'published reviews'], emptyT: 'Yours can be the first one here.', empty: 'A few words are enough to start the conversation.', more: 'See more feedback',
    wT: 'They also write to us',
    ok: 'Thank you for your feedback!', okS: 'It was sent to the team and now appears on this page.', okPriv: 'It was sent to the team. It will not be shown on the website.', again: 'Write another one',
    share: 'Invite someone to share theirs', shareTxt: 'I just shared my feedback on Bwat Sekrèm Talks. Share yours here: https://bwatsekremtalks.com/avis',
    err: { nom: 'Enter your name (at least 2 characters).', message: 'Write your message (at least 5 characters).', lien: 'Links are not allowed.', vit: 'Please wait a few seconds before sending again.', double: 'This feedback was already sent.', note: 'Invalid rating.', x: 'Sending failed. Please try again.' },
    ago: (m) => (m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} d ago`) },
};
/* Quelques messages reçus par l'équipe (WhatsApp, réseaux), anonymes, dans leur langue d'origine. */
const WALL = ['Sa fè lontan nou t ap tann jan de aktivite sa yo.', 'Entèvenan yo enspiran anpil.', 'Je tiens à saluer votre professionnalisme et l’organisation.', 'Mwen renmen nivo òganizasyon ak swivi ki genyen sou evènman sa a.', 'Nou anvi nou òganize youn Pòtoprens tou.', 'Mwen renmen jan n ap vann imaj nou yo, nou pwòp anpil.'];
const q = new URLSearchParams(location.search), L = T[q.get('lang')] ? q.get('lang') : 'fr', t = T[L], EMBED = q.get('embed') === '1', TITRE = !EMBED || q.get('titre') === '1';
document.documentElement.lang = L; if (EMBED) document.body.classList.add('embed'); if (!TITRE) document.body.classList.add('sanstitre');
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let SID = ls.get('bst_avis_sid'); if (!SID) { SID = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); ls.set('bst_avis_sid', SID); }
const COL = ['#2f8fe8', '#5DB033', '#7c4dff', '#ff8a00', '#e8436b', '#0D2D4A', '#0aa3a3'];
const avc = (n) => COL[[...String(n || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % COL.length];
const ini = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const sendH = () => { if (!EMBED) return; try { parent.postMessage({ bstH: Math.ceil($('s').getBoundingClientRect().height) + 2, bstW: 'avis' }, '*'); } catch {} };
addEventListener('load', sendH); addEventListener('resize', sendH); document.fonts && document.fonts.ready.then(sendH); new ResizeObserver(sendH).observe($('s'));

/* Textes */
$('kick').textContent = t.kick; $('title').innerHTML = t.title; $('lead').textContent = t.lead;
$('fT').textContent = t.fT; $('fS').textContent = t.fS; $('lNom').textContent = t.nom; $('lProfil').textContent = t.profil; $('lNote').innerHTML = `${esc(t.note)} <small>${esc(t.opt)}</small>`; $('lMsg').textContent = t.msg;
$('message').placeholder = t.msgPh; $('lPub').textContent = t.pub; $('lPub2').textContent = t.pub2; $('send').textContent = t.send; $('safe').textContent = t.safe; $('lT').textContent = t.lT; $('more').textContent = t.more;
$('wT').textContent = t.wT; $('chips').innerHTML = WALL.map((w) => `<span>« ${esc(w)} »</span>`).join('');
$('profil').innerHTML = `<option value="">${esc(t.choose)}</option>` + t.P.map((p) => `<option>${esc(p)}</option>`).join('');
let NOTE = 0;
const drawStars = () => { $('stars').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" data-n="${n}" class="${n <= NOTE ? 'on' : ''}" aria-label="${n} / 5" aria-pressed="${n <= NOTE}">★</button>`).join('');
  $('rl').textContent = NOTE ? t.rates[NOTE] : t.rate0; $('rl').className = 'rl' + (NOTE ? ' on' : ''); };
drawStars(); $('stars').addEventListener('click', (e) => { const b = e.target.closest('[data-n]'); if (!b) return; NOTE = +b.dataset.n === NOTE ? 0 : +b.dataset.n; drawStars(); });
/* Idées pour commencer : un clic place un début de phrase dans le message */
$('ideas').innerHTML = t.ideas.map(([e, l], i) => `<button type="button" data-i="${i}">${e} ${esc(l)}</button>`).join('');
const count = () => { $('cnt').textContent = $('message').value.length; };
$('ideas').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const m = $('message'), s = t.ideas[+b.dataset.i][2], v = m.value.replace(/\s+$/, '');
  m.value = (v ? v + '\n' : '') + s; count(); m.focus(); m.setSelectionRange(m.value.length, m.value.length); });
$('message').addEventListener('input', count);

/* Chiffres et liste */
let ALL = [], SHOWN = 3;
function render(d) {
  if (d) ALL = d.avis || [];
  if (d) { const n = d.total || 0, moy = d.moyenne ? String(d.moyenne).replace('.', L === 'en' ? '.' : ',') : null;
    $('stats').innerHTML = (n ? `<div class="stat hi"><div class="ic">⭐</div><b>${moy ? `${esc(moy)}<span class="s">★</span>` : n}</b><small>${moy ? `${n} ` : ''}${n > 1 ? t.avis[1] : t.avis[0]}</small></div>` : `<div class="stat hi"><div class="ic">✨</div><b>${esc(t.first)}</b><small>${esc(t.firstS)}</small></div>`)
      + `<div class="stat"><div class="ic">⏱️</div><b>${esc(t.s2)}</b><small>${esc(t.s2s)}</small></div><div class="stat wide"><div class="ic">👀</div><b>${esc(t.s3)}</b><small>${esc(t.s3s)}</small></div>`; }
  const now = Date.now();
  if (d) { const pre = (n) => String(n || '').trim().split(/\s+/)[0], a = ALL[0], b = ALL[1], w = $('who2'); w.hidden = !a;
    if (a) w.innerHTML = `<span class="stk">${ALL.slice(0, 4).map((x) => `<i style="background:${avc(x.nom)}">${esc(ini(x.nom))}</i>`).join('')}</span><span>${esc(t.who(pre(a.nom), b ? pre(b.nom) : '', b ? Math.max(0, (d.total || 0) - 2) : 0))}</span>`; }
  $('lN').hidden = !ALL.length; $('lN').textContent = `${ALL.length} ${ALL.length > 1 ? t.pubN[1] : t.pubN[0]}`;
  $('list').innerHTML = ALL.slice(0, SHOWN).map((a) => `<article class="av"><span class="q">”</span>${a.note ? `<div class="st">${'★'.repeat(a.note)}<span style="color:#d4dbe5">${'★'.repeat(5 - a.note)}</span></div>` : ''}
    <p>${esc(a.message)}</p><div class="who"><span class="ini" style="background:${avc(a.nom)}">${esc(ini(a.nom))}</span><div><b>${esc(a.nom)}</b><span>${[a.profil, t.ago(Math.floor((now - new Date(a.cree_le)) / 60000))].filter(Boolean).map(esc).join(' · ')}</span></div></div></article>`).join('')
    || `<div class="empty"><b>${esc(t.emptyT)}</b>${esc(t.empty)}</div>`;
  $('more').hidden = ALL.length <= SHOWN; sendH();
}
render({ avis: [], total: 0, moyenne: null });
const load = () => rpc('talks_avis_lis', { p_limit: 200 }).then((d) => { if (d && Array.isArray(d.avis)) render(d); }).catch(() => {});
$('more').addEventListener('click', () => { SHOWN += 6; render(); });
load();

/* Envoi */
$('f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('msg').className = 'msg'; $('msg').textContent = '';
  const nom = $('nom').value.trim(), message = $('message').value.trim();
  if (nom.length < 2) { $('msg').className = 'msg err'; $('msg').textContent = t.err.nom; $('nom').focus(); sendH(); return; }
  if (message.length < 5) { $('msg').className = 'msg err'; $('msg').textContent = t.err.message; $('message').focus(); sendH(); return; }
  $('send').disabled = true; $('send').textContent = t.sending;
  let r = null; try { r = await rpc('talks_avis_voye', { p_nom: nom, p_profil: $('profil').value || null, p_note: NOTE || null, p_message: message, p_public: $('pub').checked, p_sid: SID }); } catch {}
  $('send').disabled = false; $('send').textContent = t.send;
  if (!r || !r.ok) { $('msg').className = 'msg err'; $('msg').textContent = (r && t.err[r.error]) || t.err.x; sendH(); return; }
  try { (window.top.gtag || window.gtag)?.('event', 'avis_envoye', { note: NOTE || 0 }); } catch {}
  const pub = $('pub').checked;
  $('formCard').innerHTML = `<div class="thanks"><div class="e">💚</div><b>${esc(t.ok)}</b><p>${esc(pub ? t.okS : t.okPriv)}</p><div class="acts"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t.shareTxt)}">${esc(t.share)}</a><button type="button" onclick="location.reload()">${esc(t.again)}</button></div></div>`;
  load(); sendH();
});
</script>
</body>
</html>
