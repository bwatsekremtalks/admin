try { if (window.self !== window.top) document.documentElement.classList.add('emb'); } catch { document.documentElement.classList.add('emb'); }
let L = 'fr', SEL = [], PH = [];   // PH : photos réduites (dataURL jpeg) avant envoi
function renderPh() { $('phG').innerHTML = PH.map((p, i) => `<div><img src="${p}" alt="" /><button type="button" data-phx="${i}" aria-label="✖">×</button></div>`).join(''); $('phN').textContent = PH.length ? `${PH.length}/6` : ''; }
function shrink(f) { return new Promise((ok) => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); ok(c.toDataURL('image/jpeg', 0.82)); }; img.onerror = () => ok(null); img.src = URL.createObjectURL(f); }); }
const t = () => T[L];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function renderKoms() { $('koms').innerHTML = KOMS.map((k) => { const i = SEL.indexOf(k), [n, d] = t().k[k]; return `<button type="button" class="kom" data-k="${k}" aria-pressed="${i >= 0}">${i >= 0 ? `<i>${t().choix(i + 1)}</i>` : ''}<b>${n}</b><span>${d}</span></button>`; }).join(''); }
function setLang(l) {
  L = T[l] ? l : 'fr'; document.documentElement.lang = L; try { localStorage.setItem('bst_lang', L); } catch {}
  document.querySelectorAll('[data-l]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === L));
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t()[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-th]').forEach((el) => { el.innerHTML = t()[el.dataset.th]; });
  $('gains').innerHTML = t().gains.map(([e, s, d]) => `<div><b>${e}</b><strong>${esc(s)}</strong><small>${esc(d)}</small></div>`).join('');
  const occ = $('occ').value; $('occ').innerHTML = t().occs.map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join(''); $('occ').value = occ;
  renderKoms();
}
$('phF').addEventListener('change', async () => {
  const fs = [...$('phF').files]; $('phF').value = '';
  for (const f of fs) { if (PH.length >= 6) { $('err').textContent = t().phMax; break; } const d = await shrink(f); if (d) PH.push(d); }
  renderPh();
});
document.addEventListener('click', (e) => {
  const x = e.target.closest('[data-phx]'); if (x) { PH.splice(+x.dataset.phx, 1); renderPh(); return; }
  const l = e.target.closest('[data-l]'); if (l) return setLang(l.dataset.l);
  const k = e.target.closest('[data-k]'); if (k) { const i = SEL.indexOf(k.dataset.k); if (i >= 0) SEL.splice(i, 1); else { if (SEL.length >= 2) SEL.shift(); SEL.push(k.dataset.k); } $('eKom').textContent = ''; renderKoms(); }
});
$('send').addEventListener('click', async () => {
  const err = (s, id = 'err') => { $(id).textContent = s; if (id === 'eKom') $('koms').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  $('err').textContent = '';
  const nom = $('nom').value.trim(), tel = $('tel').value.trim();
  if (!SEL.length) return err(t().eKom, 'eKom');
  if (nom.length < 2) return err(t().eNom);
  if (tel.replace(/\D/g, '').length < 8) return err(t().eTel);
  if (!$('ok').checked) return err(t().eOk);
  $('send').disabled = true;
  try {
    // 1. Photos -> espace privé « benevoles » (lisible seulement par l'équipe BST)
    const paths = [];
    if (PH.length) {
      const dir = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16)));
      for (let i = 0; i < PH.length; i++) {
        $('err').style.color = 'var(--muted)'; $('err').textContent = t().phUp(i + 1, PH.length);
        const blob = await (await fetch(PH[i])).blob(), path = `${dir}/${i + 1}.jpg`;
        const up = await fetch(`${SB_URL}/storage/v1/object/benevoles/${path}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }, body: blob });
        if (!up.ok) { $('err').style.color = ''; throw new Error('photo'); }
        paths.push(path);
      }
      $('err').style.color = ''; $('err').textContent = '';
    }
    const r = await fetch(`${SB_URL}/rest/v1/rpc/talks_benevole_kandida`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_nom: nom, p_telephone: tel, p_email: $('email').value.trim() || null, p_occupation: $('occ').value || null, p_organisation: $('org').value.trim() || null,
        p_komisyon1: SEL[0], p_komisyon2: SEL[1] || null, p_disponib: [], p_eksperyans: $('eks').value.trim() || null, p_motivasyon: $('mot').value.trim() || null, p_lang: L, p_photos: paths }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'api');
    $('formView').classList.add('hidden'); $('okView').classList.remove('hidden');
    $('okP').textContent = t().okP(nom.split(' ')[0]);
    $('okWa').href = `https://wa.me/${WA}?text=${encodeURIComponent(t().waTxt)}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    try { gtag('event', 'benevole_kandida', { komisyon: SEL[0] }); } catch {}
  } catch (e) { err(e.message === 'photo' ? t().ePh : e.message === 'tel' ? t().eTel : e.message === 'nom' ? t().eNom : t().eApi); }
  $('send').disabled = false;
});

setLang(l0 || 'fr');

if (q.get('nom')) $('nom').value = q.get('nom').slice(0, 120);
