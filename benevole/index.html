    choix: (n) => `Chwa ${n}`, youT: 'Ou menm', nom: 'Non konplè', tel: 'Telefòn (WhatsApp)', email: 'Imèl', opt: '(pa obligatwa)', occ: 'Ou se…',

function setLang(l) {

document.addEventListener('click', (e) => {
