    else if (!j.personnes.length) say(`${t().pasPresent} <a href="https://wa.me/${WA}?text=${encodeURIComponent(t().waTxt + tel)}" target="_blank" rel="noopener">WhatsApp</a>`, 'info');
    else if (j.personnes.length === 1) { say(''); await show(j.personnes[0]); }
    else { say(t().choisir); $('who').innerHTML = j.personnes.map((p, i) => `<button type="button" data-i="${i}">🎓 ${esc(p.nom)}</button>`).join(''); $('who').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) show(j.personnes[+b.dataset.i]); }; }
  } catch { say(t().eNet, 'err'); }
  $('go').disabled = false;
});
$('tel').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

/* ---------- Démarrage ---------- */
const q = new URLSearchParams(location.search);
let l0 = q.get('lang'); try { l0 = l0 || localStorage.getItem('bst_lang'); } catch {}
setLang(l0 || 'fr');
if (q.get('tel')) $('tel').value = q.get('tel').slice(0, 25);
if (q.get('v')) {   // vérification d'un certificat (lien du QR code)
  $('verView').classList.remove('hidden');
  rpc('talks_certificat_verif', { p_code: q.get('v') }).then((j) => { $('verBox').innerHTML = j.ok ? `<b>✅</b><span>${t().verOk(j.nom)}</span>` : `<b>❌</b><span>${t().verNo}</span>`; }).catch(() => { $('verBox').textContent = t().eNet; });
}
if (q.has('demo')) show({ nom: q.get('demo') || 'Marie-Ange Joseph', code: 'BST26-DEMO0000' });
</script>
</body>
