  if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(`${PAGE}?v=${code}`); q.make(); const n = q.getModuleCount(), s = qs / n;
    c.fillStyle = '#fff'; c.fillRect(qx - 10, qy - 10, qs + 20, qs + 20); c.fillStyle = NAVY;
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(qx + k * s, qy + r * s, s + .5, s + .5); }
  c.textAlign = 'center'; c.fillStyle = '#5b6f8a'; c.font = `400 17px ${LX}`; c.fillText('Vérifier ce certificat', qx + qs / 2, qy + qs + 34);
  c.fillStyle = NAVY; c.font = `700 19px ${LX}`; c.fillText(code, qx + qs / 2, qy + qs + 60);
  c.textAlign = 'left';
  if (demo) { c.save(); c.translate(W / 2 + 60, H / 2); c.rotate(-0.32); c.textAlign = 'center'; c.fillStyle = 'rgba(232,80,91,.16)'; c.font = `800 210px ${LX}`; c.fillText(demo, 0, 70); c.restore(); }
}

async function show(p) {
  CUR = p; await draw(p.nom, p.code, null, null, p.live);
  $('certT').textContent = t().certT(p.nom); $('certView').classList.remove('hidden');
  const url = `${PAGE}?v=${p.code}`;
  $('li').href = 'https://www.linkedin.com/profile/add?' + new URLSearchParams({ startTask: 'CERTIFICATION_NAME', name: 'Participation – Bwat Sekrèm Talks : Du potentiel à la performance', organizationName: 'Bwat Sekrèm Talks', issueYear: '2026', issueMonth: '11', certUrl: url, certId: p.code }).toString();
  $('certView').scrollIntoView({ behavior: 'smooth', block: 'start' });
  try { gtag('event', 'certificat_affiche'); } catch {}
}
const fname = () => `certificat-bst-${(CUR?.nom || 'participant').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`;
$('dlPng').addEventListener('click', () => { const a = document.createElement('a'); a.download = fname() + '.png'; a.href = $('cv').toDataURL('image/png'); a.click(); try { gtag('event', 'certificat_png'); } catch {} });
$('dlPdf').addEventListener('click', () => {
  const img = $('cv').toDataURL('image/jpeg', .95), w = window.open('');
  if (!w) return;
  w.document.write(`<!doctype html><title>${esc(fname())}</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0}img{width:297mm;height:210mm;display:block}</style><img src="${img}" onload="setTimeout(()=>print(),250)">`); w.document.close();
  try { gtag('event', 'certificat_pdf'); } catch {}
});
$('share').addEventListener('click', async () => {
  const blob = await new Promise((r) => $('cv').toBlob(r, 'image/png')), file = new File([blob], fname() + '.png', { type: 'image/png' });
  const text = `${t().shareTxt} ${PAGE}?v=${CUR.code}`;
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text }); return; } catch {} }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
});

/* ---------- Popup de demande ---------- */
const isLive = () => (document.querySelector('input[name=pMode]:checked') || {}).value === 'live';
function updWa() { const n = $('pNom').value.trim(), tl = $('pTel').value.trim(); $('pTelL').textContent = isLive() ? t().pTelLive : t().pTel; $('waBtn').href = `https://wa.me/${WA}?text=${encodeURIComponent(t().waMsg(n || '…', tl || '…', isLive()))}`; }
document.querySelectorAll('input[name=pMode]').forEach((r) => r.addEventListener('change', updWa));
['pNom', 'pTel'].forEach((id) => $(id).addEventListener('input', () => { $('pMsg').textContent = ''; updWa(); }));
$('waBtn').addEventListener('click', (e) => {
  if ($('pNom').value.trim().length < 3 || $('pTel').value.replace(/\D/g, '').length < 8) { e.preventDefault(); $('pMsg').className = 'msg err'; $('pMsg').textContent = t().ePay; return; }
  try { gtag('event', 'certificat_demande'); } catch {}
});
$('openPay').addEventListener('click', () => { $('pay').showModal(); try { gtag('event', 'certificat_popup'); } catch {} });
$('payX').addEventListener('click', () => $('pay').close());
$('pay').addEventListener('click', (e) => { if (e.target === $('pay')) $('pay').close(); });

/* ---------- Code certificat ---------- */
async function rpc(fn, body) { const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if (!r.ok) throw new Error('net'); return r.json(); }
async function ouvrir(mot) {
  const code = $('code').value.trim(), m = $('msg'), say = (s, k) => { m.className = 'msg ' + (k || ''); m.innerHTML = s; };
  $('certView').classList.add('hidden'); CUR = null;
  if (code.replace(/[^a-z0-9]/gi, '').length < 10) return say(t().eCode, 'err');
  $('go').disabled = $('motGo').disabled = true; say('…');
  try {
    const j = await rpc('talks_cert_code', { p_code: code, p_mot: mot || null });
    if (!j.ok) { say(t().eCode, 'err'); $('motBox').classList.add('hidden'); }
    else {
      try { localStorage.setItem(KEEP, code.toUpperCase()); } catch {}
      const live = j.mode === 'live';
      $('motBox').classList.toggle('hidden', !(live && j.ouvert && !j.present));
      if (!j.ouvert) say(live ? t().avantLive(j.nom) : t().avant(j.nom), 'ok');
      else if (j.present) { say(''); await show({ nom: j.nom, code: j.cert, live }); }
      else if (live) say(j.error === 'mot' ? t().eMot : j.error === 'delai' ? t().eDelai : '', j.error ? 'err' : '');
      else say(`${t().absent} <a href="https://wa.me/${WA}?text=${encodeURIComponent(code)}" target="_blank" rel="noopener">WhatsApp</a>`, 'info');
    }
  } catch { say(t().eNet, 'err'); }
  $('go').disabled = $('motGo').disabled = false;
}
$('go').addEventListener('click', () => ouvrir(null));
$('motGo').addEventListener('click', () => { const v = $('mot').value.trim(); if (v) ouvrir(v); });
$('mot').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('motGo').click(); });
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

/* ---------- Démarrage ---------- */
const q = new URLSearchParams(location.search);
let l0 = q.get('lang'); try { l0 = l0 || localStorage.getItem('bst_lang'); } catch {}
setLang(l0 || 'fr');
draw(L === 'ht' ? 'Non w isit la' : L === 'en' ? 'Your Name Here' : 'Votre Nom Ici', 'BST26-XXXXXXXX', 'EXEMPLE', $('mockCv'));
let saved = q.get('code'); try { saved = saved || localStorage.getItem(KEEP); } catch {}
if (saved) $('code').value = saved.slice(0, 16);
if (q.get('tel')) $('pTel').value = q.get('tel').slice(0, 25);
updWa();
if (q.get('v')) {   // vérification d'un certificat (lien du QR code) : affichée en haut de la page
  const code = q.get('v').toUpperCase().slice(0, 20);
  $('verView').classList.remove('hidden'); $('verBox').innerHTML = `<p class="vt">${t().vChk}</p>`;
  rpc('talks_certificat_verif', { p_code: code }).then((j) => {
    $('verBox').innerHTML = j.ok
      ? `<img src="../portrait/logos/bst-couleur.png" alt="Bwat Sekrèm Talks" /><br><span class="vb ok">✅ ${t().vOk}</span><div class="vn">${esc(j.nom)}</div><p class="vt">${t().vTxt}</p>
         <div class="vm"><span>🎓 22 novembre 2026</span><span>${j.mode === 'live' ? t().vLive : t().vSalle}</span></div><div class="vc">${esc(code)}</div><a class="vl" href="./">${t().vMore}</a>`
      : `<img src="../portrait/logos/bst-couleur.png" alt="Bwat Sekrèm Talks" /><br><span class="vb no">❌ ${t().verNo}</span><div class="vc">${esc(code)}</div>`;
    try { gtag('event', 'certificat_verifie', { ok: !!j.ok }); } catch {}
  }).catch(() => { $('verBox').innerHTML = `<p class="vt">${t().eNet}</p>`; });
}
if (q.has('demo')) show({ nom: q.get('demo') || 'Marie-Ange Joseph', code: 'BST26-DEMO0000', live: q.has('live') });
</script>
