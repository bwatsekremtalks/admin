<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compteur des réservations — Bwat Sekrèm Talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet" />
<!--
  Compteur EN DIRECT des réservations, à intégrer sur bwatsekremtalks.com (iframe).
  Paramètres d'URL (tous facultatifs) :
    ?lang=fr|ht|en        langue (fr par défaut)
    &style=clair|sombre   fond blanc ou bleu nuit (clair par défaut)
    &lien=URL             ajoute un bouton « Réserver ma place » vers cette adresse
  Les chiffres viennent de la fonction publique talks_compteur (totaux seulement, aucune donnée personnelle).
-->
<style>
  :root { --navy: #0D2D4A; --green: #5DB033; --blue: #1E8CF0; --bg: #ffffff; --ink: #0D2D4A; --mute: #4a6380; --line: rgba(13,45,74,.12); --track: rgba(13,45,74,.08); }
  .sombre { --bg: linear-gradient(120deg, #0a2238, #123d66); --ink: #ffffff; --mute: rgba(255,255,255,.78); --line: rgba(255,255,255,.18); --track: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font-family: Lexend, "DM Sans", system-ui, sans-serif; }
  .box { background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 22px; padding: 14px 22px 16px; display: grid; gap: 8px; justify-items: center; text-align: center; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #e8505b; box-shadow: 0 0 0 0 rgba(232,80,91,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(232,80,91,0); } 100% { box-shadow: 0 0 0 0 rgba(232,80,91,0); } }
  .num { display: flex; align-items: baseline; justify-content: center; gap: 8px; flex-wrap: wrap; line-height: 1.1; }
  .num b { font-weight: 700; font-size: clamp(38px, 8.5vw, 52px); color: var(--green); font-variant-numeric: tabular-nums; }
  .num .cap { font-weight: 600; font-size: clamp(22px, 5vw, 30px); color: var(--mute); font-variant-numeric: tabular-nums; }
  .num span.lab { font-weight: 400; font-size: clamp(15px, 3.6vw, 19px); }
  .bar { width: min(560px, 100%); height: 14px; border-radius: 999px; background: var(--track); overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #5DB033, #8fd14f); transition: width 1.4s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  .bar i.chaud { background: linear-gradient(90deg, #5DB033, #F5A623); } .bar i.tres { background: linear-gradient(90deg, #F5A623, #e8505b); }
  .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: shine 2.4s ease-in-out infinite; }
  @keyframes shine { 60%, 100% { transform: translateX(100%); } }
  .row { display: flex; gap: 8px 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .lim { display: inline-block; white-space: nowrap; max-width: 100%; background: #fff4e0; color: #8a4b00; border: 1px solid #f5d9a8; border-radius: 999px; padding: 6px clamp(10px, 3vw, 14px); font-size: clamp(12px, 4.1vw, 14.5px); font-weight: 600; line-height: 1.35; }
  .lim b { font-weight: 700; color: #c2410c; }
  .sombre .lim { background: rgba(245,166,35,.16); color: #ffd28a; border-color: rgba(245,166,35,.4); } .sombre .lim b { color: #ffb36b; }
  .today { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #3f7f22; background: #eaf6e2; border-radius: 999px; padding: 3px 11px; align-self: center; white-space: nowrap; }
  .today:empty { display: none; } .sombre .today { color: #b9e39a; background: rgba(122,193,66,.18); }
  .cta { display: inline-flex; align-items: center; justify-content: center; background: var(--green); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 10px 20px; white-space: nowrap; }
  .cta:hover { filter: brightness(1.06); }
  .wait { width: min(560px, 100%); display: flex; align-items: center; gap: 14px; background: linear-gradient(120deg, #fff7e8, #fff1f0); border: 1.5px solid #f5d9a8; border-radius: 18px; padding: 10px 16px; text-align: left; }
  .wait .ic { flex: none; width: 46px; height: 46px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 24px; box-shadow: 0 4px 12px rgba(194,65,12,.12); }
  .wait .tx { flex: 1; min-width: 0; } .wait .tx small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a3580b; }
  .wait .tx span { display: block; font-size: 13px; color: #7a5a3a; line-height: 1.3; margin-top: 1px; }
  .wait .wn { flex: none; display: grid; justify-items: end; } .wait .wn b { font-weight: 700; font-size: clamp(28px, 7vw, 36px); line-height: 1; color: #c2410c; font-variant-numeric: tabular-nums; }
  .wait .wn em { font-style: normal; font-size: 12px; font-weight: 600; color: #a3580b; white-space: nowrap; }
  .wait .up { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: #3f7f22; background: #eaf6e2; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .wait .up:empty { display: none; }
  .wait.bump .wn b { animation: bump .6s ease; } @keyframes bump { 40% { transform: scale(1.25); } }
  .sombre .wait { background: rgba(245,166,35,.12); border-color: rgba(245,166,35,.4); } .sombre .wait .tx small, .sombre .wait .wn em { color: #ffd28a; } .sombre .wait .tx span { color: rgba(255,255,255,.8); } .sombre .wait .wn b { color: #ffb36b; } .sombre .wait .ic { background: rgba(255,255,255,.1); }
  .full .num b { color: #e8505b; }
  .wait .wl { display: block; font-style: normal; margin-top: 4px; font-weight: 700; color: #c2410c; } .wait .wl b { font-size: 1.1em; }
  .wait .wbar { display: block; height: 6px; border-radius: 6px; background: rgba(194,65,12,.15); margin-top: 6px; overflow: hidden; } .wait .wbar i { display: block; height: 100%; background: linear-gradient(90deg, #F5A623, #e8505b); border-radius: 6px; }
  .wait.plein { background: #fdecec; border-color: #f3c0ba; } .wait.plein .tx small { color: #b42318; }
  .full .lim { white-space: normal; text-align: center; }
  @media (max-width: 480px) { .wait { display: grid !important; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 10px 12px; }
    .wait .ic { width: 40px; height: 40px; font-size: 21px; grid-row: 1; } .wait .tx { display: contents; } .wait .tx small { grid-row: 1; grid-column: 2; align-self: center; }
    .wait .wn { grid-row: 1; grid-column: 3; display: flex; align-items: baseline; gap: 5px; } .wait .wn .up { display: none; }
    .wait .tx span { grid-column: 1 / -1; font-size: 12px; } .wait .wn b { font-size: 24px; } .wait .wn em { font-size: 11px; } .wait .tx small { font-size: 11px; letter-spacing: .05em; } }
  @media (prefers-reduced-motion: reduce) { .bar i, .bar i::after, .live i { animation: none; transition: none; } }
</style>
</head>
<body>
<div class="box" id="box" aria-live="polite">
  <span class="live"><i></i><span id="tLive"></span></span>
  <div class="num"><b id="n">—</b><span class="cap" id="cap"></span><span class="lab" id="tPers"></span><span class="today" id="today"></span></div>
  <div class="bar" id="bar" role="progressbar" aria-valuemin="0"><i id="fill"></i></div>
  <div class="row"><span class="lim" id="lim"></span></div>
  <div class="wait" id="wait" style="display:none"><span class="ic">⏳</span><div class="tx"><small id="wT"></small><span id="wS"></span></div><div class="wn"><b id="wN">0</b><em id="wP"></em><span class="up" id="wUp"></span></div></div>
  <a class="cta" id="cta" target="_top" style="display:none"></a>
</div>
<script>
const SB_URL = 'https://nltlgytehikguydcdhyy.supabase.co', SB_KEY = 'sb_publishable_ncDXEDbAodI2yxhwlTrnwg_M4SvBqly';
const q = new URLSearchParams(location.search);
const T = {
  fr: { live: 'En direct', pers: (n, cap) => cap ? 'places réservées' : (n > 1 ? 'personnes ont déjà réservé leur place' : 'personne a déjà réservé sa place'), today: (n) => `▲ +${n} inscrit${n > 1 ? 's' : ''} aujourd’hui`, rest: (r) => `🔥 Plus que <b>${r}</b> place${r > 1 ? 's' : ''} disponible${r > 1 ? 's' : ''}`, full: '🔥 Forte demande : tout n’est pas encore joué !', wT: 'Liste d’attente', wS: 'Nous recevons énormément de demandes et notre équipe logistique travaille déjà pour accueillir plus de monde. Inscrivez-vous sur la liste d’attente pour que nous puissions prévoir votre place !', wP: (n) => n > 1 ? 'personnes' : 'personne', wUp: (n) => `▲ +${n} aujourd’hui`, wOf: (m) => `sur ${m} places`, wLeft: (r) => `⚠️ Plus que <b>${r}</b> place${r > 1 ? 's' : ''} sur la liste d’attente : faites vite !`, wFullT: 'Liste d’attente complète', wFullS: 'Toutes les places de la liste d’attente sont prises. Vous pouvez suivre l’événement en Live, ou nous écrire sur WhatsApp.', lim: '⚠️ Places limitées : réservez vite la vôtre', cta: 'Réserver ma place' },
  ht: { live: 'An dirèk', pers: (n, cap) => cap ? 'plas rezève' : 'moun deja rezève plas yo', today: (n) => `▲ +${n} moun enskri jodi a`, rest: (r) => `🔥 Rete <b>${r}</b> plas sèlman`, full: '🔥 Anpil demann : tout bagay poko fini !', wT: 'Lis datant', wS: 'N ap resevwa anpil demann, e ekip lojistik la deja ap travay pou n ka akeyi plis moun. Enskri sou lis datant lan pou n ka prepare plas pa w !', wP: () => 'moun', wUp: (n) => `▲ +${n} jodi a`, wOf: (m) => `sou ${m} plas`, wLeft: (r) => `⚠️ Rete <b>${r}</b> plas sèlman sou lis datant lan : fè vit !`, wFullT: 'Lis datant lan plen', wFullS: 'Tout plas sou lis datant lan pran. Ou ka swiv evènman an an Live, oswa ekri nou sou WhatsApp.', lim: '⚠️ Plas yo limite : rezève pa w vit', cta: 'Rezève plas mwen' },
  en: { live: 'Live', pers: (n, cap) => cap ? 'seats booked' : (n > 1 ? 'people have already booked their seat' : 'person has already booked a seat'), today: (n) => `▲ +${n} joined today`, rest: (r) => `🔥 Only <b>${r}</b> seat${r > 1 ? 's' : ''} left`, full: '🔥 High demand: it’s not over yet!', wT: 'Waiting list', wS: 'We’re receiving a huge number of requests and our logistics team is already working to welcome more people. Join the waiting list so we can plan a seat for you!', wP: (n) => n > 1 ? 'people' : 'person', wUp: (n) => `▲ +${n} today`, wOf: (m) => `of ${m} spots`, wLeft: (r) => `⚠️ Only <b>${r}</b> spot${r > 1 ? 's' : ''} left on the waiting list: hurry!`, wFullT: 'Waiting list full', wFullS: 'All waiting-list spots are taken. You can follow the event Live, or message us on WhatsApp.', lim: '⚠️ Limited seats: book yours now', cta: 'Book my seat' },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const L = T[q.get('lang')] ? q.get('lang') : 'fr', t = T[L];
document.documentElement.lang = L;
if (q.get('style') === 'sombre') document.body.classList.add('sombre');
document.getElementById('tLive').textContent = t.live;
document.getElementById('lim').textContent = t.lim;
const lien = q.get('lien');
if (lien && /^https?:\/\//i.test(lien)) { const a = document.getElementById('cta'); a.href = lien; a.textContent = t.cta; a.style.display = ''; }
let shown = 0;
function countTo(n) {   // petite animation du chiffre
  const start = shown, d = n - start, t0 = performance.now(), dur = start ? 700 : 1400;
  const step = (now) => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); document.getElementById('n').textContent = Math.round(start + d * e); if (k < 1) requestAnimationFrame(step); else shown = n; };
  requestAnimationFrame(step);
}
async function load() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/talks_compteur`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: '{}' });
    if (!r.ok) return;
    const j = await r.json(), n = +j.personnes || 0, cap = +j.capacite || 0;
    const att = cap ? Math.max(0, n - cap) : 0, nAff = cap ? Math.min(n, cap) : n;   // au-delà de la capacité : liste d'attente
    if (nAff !== shown) countTo(nAff);
    document.getElementById('cap').textContent = cap ? `/ ${cap}` : '';
    document.getElementById('tPers').textContent = t.pers(n, cap);
    document.getElementById('today').textContent = !att && j.aujourdhui > 0 ? t.today(j.aujourdhui) : '';
    document.getElementById('box').classList.toggle('full', !!att || (cap && n >= cap));
    const w = document.getElementById('wait');
    const amax = +j.attente_max || 0, attA = amax ? Math.min(att, amax) : att, plein = amax && att >= amax;
    if (att) { w.style.display = ''; w.classList.toggle('plein', !!plein); document.getElementById('wT').textContent = plein ? t.wFullT : t.wT;
      document.getElementById('wS').innerHTML = plein ? t.wFullS : esc(t.wS) + (amax ? `<i class="wl">${t.wLeft(amax - attA)}</i><i class="wbar"><i style="width:${Math.round(attA / amax * 100)}%"></i></i>` : '');
      const wn = document.getElementById('wN'), prev = +wn.dataset.v || 0; wn.textContent = amax ? `${attA}/${amax}` : att; wn.dataset.v = att; if (prev && att > prev) { w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump'); }
      document.getElementById('wP').textContent = t.wP(amax ? attA : att); const up = Math.min(att, +j.aujourdhui || 0); document.getElementById('wUp').textContent = up > 0 ? t.wUp(up) : ''; sendH(); }
    else w.style.display = 'none';
    const bar = document.getElementById('bar'), fill = document.getElementById('fill');
    if (cap) {
      const pct = Math.min(100, n / cap * 100), rest = Math.max(0, cap - n);
      bar.style.display = ''; bar.setAttribute('aria-valuemax', cap); bar.setAttribute('aria-valuenow', n);
      requestAnimationFrame(() => { fill.style.width = Math.max(3, pct) + '%'; });
      fill.className = pct >= 90 ? 'tres' : pct >= 70 ? 'chaud' : '';
      document.getElementById('lim').innerHTML = rest > 0 ? t.rest(rest) : t.full;
    } else { bar.style.display = 'none'; document.getElementById('lim').textContent = t.lim; }
  } catch {}
}
load(); setInterval(load, 60000);
// Hauteur exacte envoyée à la page qui intègre (le script du site ajuste l'iframe)
const sendH = () => { try { parent.postMessage({ bstH: Math.ceil(document.getElementById('box').getBoundingClientRect().height) + 4, bstW: 'compteur' }, '*'); } catch {} };
addEventListener('resize', sendH); setTimeout(sendH, 300); setTimeout(sendH, 1800); document.fonts && document.fonts.ready.then(sendH);
</script>
</body>
</html>
