    niv: ['Native', 'Fluent', 'Intermediate', 'Basic'], saved: '✓ CV saved. You can come back and edit it on this phone.', local: '✓ Saved on your phone. Tick the box to send it to the BST team.', err: 'Error. Try again.', iaWait: 'AI is improving your text…', iaOk: '✓ Text improved. Read it and adjust if needed.', iaLimit: 'Daily AI help limit reached.', iaNeed: 'Write a few words first.', pdfTip: 'In the print window, choose « Save as PDF ».' },
};
const CVL = {
  fr: { profil: 'Profil', exp: 'Expérience professionnelle', edu: 'Formation', skills: 'Compétences', langs: 'Langues', certs: 'Certificats', hob: 'Centres d’intérêt', ref: 'Références', contact: 'Contact', now: 'aujourd’hui', niv: ['Langue maternelle', 'Courant', 'Intermédiaire', 'Notions'] },
  ht: { profil: 'Pwofil', exp: 'Eksperyans pwofesyonèl', edu: 'Fòmasyon', skills: 'Konpetans', langs: 'Lang', certs: 'Sètifika', hob: 'Sa m renmen fè', ref: 'Referans', contact: 'Kontak', now: 'jodi a', niv: ['Lang manman', 'Byen pale l', 'Mwayen', 'Ti kras'] },
  en: { profil: 'Profile', exp: 'Work experience', edu: 'Education', skills: 'Skills', langs: 'Languages', certs: 'Certificates', hob: 'Interests', ref: 'References', contact: 'Contact', now: 'present', niv: ['Native', 'Fluent', 'Intermediate', 'Basic'] },
};
const MODELS = { modern: 'Moderne', classic: 'Classique', minimal: 'Minimal', exec: 'Exécutif' };
const COLORS = ['#123056', '#1f6f5c', '#7a1f3d', '#3b2a6b', '#b4541a', '#2b2b2b'];
const FIELDS = ['nom', 'poste', 'telephone', 'email', 'ville', 'lien', 'rezime', 'konpetans', 'enterè', 'referans'];

const KEY = 'bst_cv_v1';
let L = 'fr', D = { modele: 'modern', koule: COLORS[0], cvLang: 'fr', photo: null, token: null, exp: [{}], edu: [{}], lang: [{ langue: 'Créole', niveau: '0' }, { langue: 'Français', niveau: '1' }], cert: [] };
const t = () => UI[L];

function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) D = Object.assign(D, s); } catch {} }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch {} }
function readForm() { FIELDS.forEach((f) => (D[f] = $(f).value)); D.cvLang = $('cvLang').value;
  for (const k of Object.keys(LISTS)) document.querySelectorAll(`[data-li="${k}"]`).forEach((el) => { const i = +el.dataset.i; LISTS[k].forEach((f) => { const x = el.querySelector(`[data-f="${f}"]`); if (x) (D[k][i] ||= {})[f] = x.value; }); }); }
function renderLists() {
  const F = t().f;
  const field = (k, i, f, o = {}) => {
    const v = esc((D[k][i] || {})[f] || '');
    if (f === 'desc') return `<label class="f">${F.desc}</label><textarea class="t" data-f="desc" maxlength="1200">${v}</textarea><button class="btn ia" type="button" data-ia="eksperyans" data-ii="${i}">${t().ia}</button><p class="msg" id="m_exp${i}"></p>`;

  $('L_edu').innerHTML = D.edu.map((_, i) => `<div class="item" data-li="edu" data-i="${i}"><button class="x" type="button" data-del="edu" data-i="${i}">✖</button><div class="g2">${['dip', 'ecole', 'lieu', 'annee'].map((f) => field('edu', i, f)).join('')}</div>${field('edu', i, 'mention', { max: 160 })}</div>`).join('');
  $('L_lang').innerHTML = D.lang.map((_, i) => `<div class="item" data-li="lang" data-i="${i}"><button class="x" type="button" data-del="lang" data-i="${i}">✖</button><div class="g2">${field('lang', i, 'langue')}<div>${field('lang', i, 'niveau')}</div></div></div>`).join('');
  $('L_cert').innerHTML = D.cert.map((_, i) => `<div class="item" data-li="cert" data-i="${i}"><button class="x" type="button" data-del="cert" data-i="${i}">✖</button><div class="g2">${['cert', 'organisme', 'an'].map((f) => field('cert', i, f)).join('')}</div></div>`).join('');

function setLang(l) {
  L = UI[l] ? l : 'fr'; document.documentElement.lang = L; try { localStorage.setItem('bst_lang', L); } catch {}
  document.querySelectorAll('[data-l]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === L));
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t()[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  readForm(); renderLists(); renderModels(); render();
}
function renderModels() {
  const mini = { modern: `<div style="position:absolute;inset:0 65% 0 0;background:${D.koule}"></div>`, classic: `<div style="position:absolute;left:20%;right:20%;top:8px;height:5px;background:${D.koule}"></div><div style="position:absolute;left:12%;right:12%;top:20px;height:1px;background:#bbb"></div>`, minimal: `<div style="position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:4px;background:${D.koule}"></div><div style="position:absolute;left:30px;top:12px;width:40%;height:5px;background:#333"></div>`, exec: `<div style="position:absolute;inset:0 0 62% 0;background:${D.koule}"></div>` };
  $('models').innerHTML = Object.entries(MODELS).map(([k, n]) => `<button type="button" data-m="${k}" aria-pressed="${D.modele === k}"><div class="mini">${mini[k]}</div>${n}</button>`).join('');
  $('colors').innerHTML = COLORS.map((c) => `<button type="button" data-c="${c}" aria-pressed="${D.koule === c}" style="background:${c}" title="${c}"></button>`).join('');
  $('phImg').src = D.photo || 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#e8eef5"/><circle cx="32" cy="25" r="11" fill="#b9c7d8"/><path d="M12 56c3-12 12-17 20-17s17 5 20 17" fill="#b9c7d8"/></svg>');
}
/* ---------- Rann CV a ---------- */
function bullets(s) { const ls = String(s || '').split('\n').map((x) => x.replace(/^\s*[•\-*]\s*/, '').trim()).filter(Boolean); return ls.length > 1 ? `<ul>${ls.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ls.length ? `<p>${esc(ls[0])}</p>` : ''; }
function render() {
  readForm(); persist();
  const C = CVL[D.cvLang] || CVL.fr, cv = $('cv'); cv.style.setProperty('--acc', D.koule);
  const has = (a) => a.some((x) => Object.values(x || {}).some((v) => String(v || '').trim()));
  const exp = has(D.exp) ? `<h2>${C.exp}</h2>` + D.exp.filter((x) => x && (x.titre || x.org)).map((x) => `<div class="job"><b>${esc(x.titre)}</b>${x.org ? ` · <span>${esc(x.org)}</span>` : ''}<div class="meta">${[x.lieu, x.debut ? `${esc(x.debut)} – ${x.fin ? esc(x.fin) : C.now}` : ''].filter(Boolean).join(' · ')}</div>${bullets(x.desc)}</div>`).join('') : '';
  const edu = has(D.edu) ? `<h2>${C.edu}</h2>` + D.edu.filter((x) => x && (x.dip || x.ecole)).map((x) => `<div class="job"><b>${esc(x.dip)}</b>${x.ecole ? ` · ${esc(x.ecole)}` : ''}<div class="meta">${[x.lieu, x.annee].filter(Boolean).map(esc).join(' · ')}</div>${x.mention ? `<p>${esc(x.mention)}</p>` : ''}</div>`).join('') : '';
  const skills = D.konpetans.trim() ? `<h2>${C.skills}</h2><div class="chips">${D.konpetans.split(/[,;\n]/).map((s) => s.trim()).filter(Boolean).map((s) => `<span>${esc(s)}</span>`).join('')}</div>` : '';
  const langs = has(D.lang) ? `<h2>${C.langs}</h2>` + D.lang.filter((x) => x && x.langue).map((x) => `<div class="lv"><b>${esc(x.langue)}</b><span>${C.niv[+x.niveau || 0]}</span></div>`).join('') : '';
  const certs = has(D.cert) ? `<h2>${C.certs}</h2>` + D.cert.filter((x) => x && x.cert).map((x) => `<div class="job"><b>${esc(x.cert)}</b><div class="meta">${[x.organisme, x.an].filter(Boolean).map(esc).join(' · ')}</div></div>`).join('') : '';
  const profil = D.rezime.trim() ? `<h2>${C.profil}</h2><p>${esc(D.rezime).replace(/\n/g, '<br>')}</p>` : '';
  const hob = D['enterè'].trim() ? `<h2>${C.hob}</h2><p>${esc(D['enterè'])}</p>` : '', ref = D.referans.trim() ? `<h2>${C.ref}</h2><p>${esc(D.referans).replace(/\n/g, '<br>')}</p>` : '';
  const contact = [D.telephone && `📞 ${esc(D.telephone)}`, D.email && `✉️ ${esc(D.email)}`, D.ville && `📍 ${esc(D.ville)}`, D.lien && `🔗 ${esc(D.lien)}`].filter(Boolean);
  const ph = D.photo ? `<img class="ph" src="${D.photo}" alt="" />` : '', nm = esc(D.nom || 'Prénom Nom'), pt = esc(D.poste || '');
  const m = D.modele;
  cv.className = 'cvpage m-' + m;
  if (m === 'modern') cv.innerHTML = `<div class="side">${ph}${contact.length ? `<h2>${C.contact}</h2>` : ''}<div class="ct">${contact.map((x) => `<div>${x}</div>`).join('')}</div>${skills}${langs}${hob}</div><div class="main"><div class="nm">${nm}</div><div class="pt">${pt}</div>${profil}${exp}${edu}${certs}${ref}</div>`;
  else if (m === 'classic') cv.innerHTML = `<div class="hd">${ph}<div class="nm">${nm}</div><div class="pt">${pt}</div><div class="meta" style="margin-top:6px">${contact.join(' · ')}</div></div>${profil}${exp}${edu}${skills}${langs}${certs}${hob}${ref}`;
  else if (m === 'minimal') cv.innerHTML = `<div class="hd">${ph}<div><div class="nm">${nm}</div><div class="pt">${pt}</div><div class="meta">${contact.join(' · ')}</div></div></div><div class="cols"><div>${profil}${exp}${edu}${ref}</div><div>${skills}${langs}${certs}${hob}</div></div>`;
  else cv.innerHTML = `<div class="band">${ph}<div><div class="nm">${nm}</div><div class="pt">${pt}</div></div></div><div class="contact">${contact.map((x) => `<span>${x}</span>`).join('')}</div><div class="body"><div>${profil}${exp}${edu}${ref}</div><div>${skills}${langs}${certs}${hob}</div></div>`;
  fit();
}
function fit() { const w = $('pvs').parentElement.clientWidth || 794, k = Math.min(1, w / 794); $('pvs').style.transform = `scale(${k})`; $('pvs').style.height = ($('cv').offsetHeight * k) + 'px'; }
window.addEventListener('resize', fit);
/* ---------- Evènman ---------- */
document.addEventListener('input', (e) => { if (e.target.closest('.form')) render(); });
document.addEventListener('change', (e) => { if (e.target.closest('.form')) render(); });
document.addEventListener('click', async (e) => {
  const l = e.target.closest('[data-l]'); if (l) return setLang(l.dataset.l);
  const v = e.target.closest('.mtabs [data-v]'); if (v) { $('app').dataset.v = v.dataset.v; document.querySelectorAll('.mtabs [data-v]').forEach((b) => b.setAttribute('aria-pressed', b === v)); if (v.dataset.v === 'pv') setTimeout(fit, 30); return; }
  const m = e.target.closest('[data-m]'); if (m) { D.modele = m.dataset.m; renderModels(); return render(); }
  const c = e.target.closest('[data-c]'); if (c) { D.koule = c.dataset.c; renderModels(); return render(); }
  const a = e.target.closest('[data-add]'); if (a) { readForm(); D[a.dataset.add].push({}); renderLists(); return render(); }
  const d = e.target.closest('[data-del]'); if (d) { readForm(); D[d.dataset.del].splice(+d.dataset.i, 1); renderLists(); return render(); }
  const ia = e.target.closest('[data-ia]'); if (ia) return amelyore(ia);
});
$('phF').addEventListener('change', () => { const f = $('phF').files[0]; if (!f) return; const i = new Image(); i.onload = () => { const s = 320, cv = document.createElement('canvas'); cv.width = cv.height = s; const k = Math.max(s / i.width, s / i.height); const x = cv.getContext('2d'); x.drawImage(i, (s - i.width * k) / 2, (s - i.height * k) / 2, i.width * k, i.height * k); D.photo = cv.toDataURL('image/jpeg', .85); renderModels(); render(); }; i.src = URL.createObjectURL(f); });
$('phX').addEventListener('click', () => { D.photo = null; $('phF').value = ''; renderModels(); render(); });
async function amelyore(b) {
  readForm(); const tip = b.dataset.ia, i = b.dataset.ii, out = tip === 'eksperyans' ? $('m_exp' + i) : $('m_' + tip);
  const say = (s, k = 'ok') => { out.className = 'msg ' + k; out.textContent = s; };
  let tekst = tip === 'rezime' ? D.rezime : tip === 'konpetans' ? D.konpetans : (D.exp[i] || {}).desc;
  const kontek = tip === 'eksperyans' ? [D.exp[i]?.titre, D.exp[i]?.org].filter(Boolean).join(' — ') : tip === 'rezime' ? D.exp.filter((x) => x && x.titre).map((x) => `${x.titre} (${x.org || ''})`).join('; ').slice(0, 280) : '';
  if ((tekst || '').trim().length < 3 && !(tip === 'konpetans' && D.poste)) return say(t().iaNeed, 'err');
  b.disabled = true; say(t().iaWait);
  try {
    const r = await fetch(`${SB_URL}/functions/v1/cv-ia`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tip, tekst: tekst || D.poste, poste: D.poste, lang: D.cvLang, kontek, token: D.token }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { b.disabled = false; return say(j.error === 'limit' ? t().iaLimit : t().err, 'err'); }
    if (tip === 'rezime') $('rezime').value = j.tekst; else if (tip === 'konpetans') $('konpetans').value = j.tekst; else document.querySelector(`[data-li="exp"][data-i="${i}"] [data-f="desc"]`).value = j.tekst;
    render(); say(t().iaOk); try { gtag('event', 'cv_ia', { tip }); } catch {}
  } catch { say(t().err, 'err'); }
  b.disabled = false;
}
$('save').addEventListener('click', async () => {
  render(); const msg = (s, k = 'ok') => { $('sMsg').className = 'msg ' + k; $('sMsg').textContent = s; };
  if (!$('ok').checked) return msg(t().local);
  $('save').disabled = true;
  try {
    const done = {}; FIELDS.forEach((f) => (done[f] = D[f])); ['exp', 'edu', 'lang', 'cert'].forEach((k) => (done[k] = D[k]));
    const r = await fetch(`${SB_URL}/rest/v1/rpc/cv_sove`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: D.token, p_lang: D.cvLang, p_modele: D.modele, p_koule: D.koule, p_done: done }) });
    if (!r.ok) throw 0; D.token = await r.json(); persist(); msg(t().saved); try { gtag('event', 'cv_sove', { modele: D.modele }); } catch {}
  } catch { msg(t().err, 'err'); }
  $('save').disabled = false;
});
$('pdf').addEventListener('click', () => { render(); $('sMsg').className = 'msg'; $('sMsg').textContent = t().pdfTip; try { gtag('event', 'cv_pdf', { modele: D.modele }); } catch {} setTimeout(() => window.print(), 150); });
/* ---------- Mòd admin : ?id=… (lekti sèlman, pou ekip BST la) ---------- */
async function adminView(id) {
  let tok = null; try { const k = Object.keys(localStorage).find((x) => /^sb-.*-auth-token$/.test(x)); tok = k && JSON.parse(localStorage.getItem(k)).access_token; } catch {}
  if (!tok) return false;
  const r = await fetch(`${SB_URL}/rest/v1/cv?id=eq.${encodeURIComponent(id)}&select=*`, { headers: { apikey: SB_KEY, Authorization: `Bearer ${tok}` } });
  const row = r.ok ? (await r.json())[0] : null; if (!row) return false;
  D = Object.assign(D, row.done, { modele: row.modele, koule: row.koule || COLORS[0], cvLang: row.lang, token: null, photo: null }); D.exp ||= []; D.edu ||= []; D.lang ||= []; D.cert ||= [];
  FIELDS.forEach((f) => ($(f).value = D[f] || '')); $('cvLang').value = D.cvLang;
  document.querySelector('.form').classList.add('hidden'); document.querySelector('.mtabs').classList.add('hidden'); $('app').style.gridTemplateColumns = '1fr'; $('app').dataset.v = 'pv';
  const bar = document.createElement('div'); bar.className = 'noprint'; bar.style.cssText = 'max-width:794px;margin:12px auto 0;display:flex;gap:8px'; bar.innerHTML = '<button class="btn main" type="button" onclick="window.print()">📄 PDF</button>';
  document.body.insertBefore(bar, $('app')); return true;
}
(async () => {
  const q = new URLSearchParams(location.search);
  let l0 = q.get('lang'); try { l0 = l0 || localStorage.getItem('bst_lang'); } catch {}
  if (q.get('id') && await adminView(q.get('id'))) { setLang(l0 || 'fr'); return; }
  let fresh = true; try { fresh = !localStorage.getItem(KEY); } catch {}
  load(); FIELDS.forEach((f) => ($(f).value = D[f] || '')); $('cvLang').value = D.cvLang || 'fr';
  if (!D.telephone && q.get('tel')) $('telephone').value = q.get('tel').slice(0, 25);
  setLang(l0 || 'fr'); if (fresh) { $('cvLang').value = L === 'en' ? 'en' : L === 'ht' ? 'ht' : 'fr'; if (L !== 'fr') D.lang = [{ langue: L === 'en' ? 'Haitian Creole' : 'Kreyòl', niveau: '0' }, { langue: L === 'en' ? 'French' : 'Fransè', niveau: '1' }]; renderLists(); render(); }
  document.fonts && document.fonts.ready.then(fit);
})();
