  Paramètres : ?lang=fr|ht|en   &embed=1 (fond transparent, hauteur envoyée au site)

<style>

  .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 26px; align-items: center; }

  .eq span { width: 9px; border-radius: 6px; background: linear-gradient(#7AC142, #2f8fe8); height: 12%; transition: height .08s linear; }
  .eq.idle span { animation: b 1.3s ease-in-out infinite; }
  @keyframes b { 0%, 100% { height: 12%; } 50% { height: var(--h, 60%); } }
  canvas.eq2 { width: 100%; height: 150px; display: block; }
  /* Lecteur */
  .player { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
  .play { flex: none; width: 74px; height: 74px; border-radius: 50%; border: 0; cursor: pointer; background: var(--green2); color: var(--ink); display: grid; place-items: center;

  .kom .sub { color: var(--mute); font-size: 14px; margin: 0 0 16px; }

  .row { display: grid; grid-template-columns: 1fr; gap: 10px; }

});
au.addEventListener('ended', () => { au.currentTime = 0; ga('jingle_fin'); });
au.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(au.duration); });
au.addEventListener('timeupdate', () => { $('cur').textContent = fmt(au.currentTime); if (au.duration && !$('seek').matches(':active')) $('seek').value = Math.round((au.currentTime / au.duration) * 1000); });
$('seek').addEventListener('input', () => { if (au.duration) au.currentTime = ($('seek').value / 1000) * au.duration; });

/* J'aime */
$('like').addEventListener('click', async () => {
  const liked = ls.get('bst_jingle_like') === '1'; ls.set('bst_jingle_like', liked ? '0' : '1');
  DATA.renmen = Math.max(0, (DATA.renmen || 0) + (liked ? -1 : 1)); render();
  const n = await rpc('talks_jingle_renmen', { p_plus: !liked }).catch(() => null); if (typeof n === 'number') { DATA.renmen = n; render(); }
  if (!liked) ga('jingle_jaime');
});
$('share').addEventListener('click', () => ga('jingle_partage'));
$('notify').addEventListener('click', () => ga('jingle_prevenir'));
$('more').addEventListener('click', () => { SHOWN += 10; render(); });

/* Commentaires */
$('fm').addEventListener('input', () => { $('fc').textContent = `${$('fm').value.length} / 500`; });
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const non = $('fn').value.trim(), mesaj = $('fm').value.trim(), m = $('fmsg');
  m.className = 'msg';
  if (non.length < 2) { m.classList.add('err'); m.textContent = t.err.non; return; }
  if (mesaj.length < 2) { m.classList.add('err'); m.textContent = t.err.mesaj; return; }
  $('fs').disabled = true; $('fs').textContent = t.sending;
  let r = null; try { r = await rpc('talks_jingle_komante_ajoute', { p_non: non, p_mesaj: mesaj, p_sid: SID }); } catch {}
  $('fs').disabled = false; $('fs').textContent = t.send;
  if (!r || !r.ok) { m.classList.add('err'); m.textContent = t.err[r && r.error] || t.err.x; sendH(); return; }
  ls.set('bst_jingle_non', non); $('fm').value = ''; $('fc').textContent = '0 / 500';
  m.classList.add('ok'); m.textContent = t.ok; ga('jingle_commentaire');
  DATA.komante = [{ non: r.non, mesaj: r.mesaj, le: r.le }, ...(DATA.komante || [])]; DATA.kantite = (DATA.kantite || 0) + 1; render();
});

load();
setInterval(() => { if (au.paused && document.visibilityState === 'visible') load(); }, 60000);   // nouveaux commentaires
</script>
</body>
</html>
