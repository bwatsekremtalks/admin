<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0D2D4A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BST Pointage" />

<title>Pointage — Bwat Sekrèm Talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!--
  Pointage du jour J (entrée de la salle). Mêmes données que l'onglet ✅ Pointage de l'espace inscriptions :
  talks_presences (présence par personne, idx -1 = la personne qui a réservé), talks_inscriptions, talks_suivi_accompagnants.
  Accès : comptes « admin » (talks_admins.wol = 'admin').
-->
<style>
  :root { --navy: #0D2D4A; --navy2: #123d66; --green: #7AC142; --green2: #5DB033; --ink: #0d2236; --ink2: #3d5577; --mute: #6b7f99; --line: #dfe7f0;
    --bg: #f2f6fb; --card: #fff; --ok: #1f8a43; --okbg: #e8f7ec; --warn: #b26b00; --warnbg: #fff4dd; --red: #c0352b; --redbg: #fdecea; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "DM Sans", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  h1, h2, .big { font-family: "Bricolage Grotesque", "DM Sans", sans-serif; }

  /* ---------- En-tête ---------- */
  .hero { color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 44px; border-radius: 0 0 28px 28px;
    background: radial-gradient(circle at 92% 0%, rgba(122,193,66,.35), transparent 45%), radial-gradient(circle at 0% 100%, rgba(47,143,232,.25), transparent 50%), linear-gradient(140deg, #0a1f38, var(--navy2)); }
  .in { max-width: 1100px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { height: 34px; }
  .top .t { flex: 1; min-width: 0; }
  .top .t b { display: block; font: 800 20px "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
  .top .t small { color: rgba(255,255,255,.72); font-size: 13px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #bff09a; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #7AC142; box-shadow: 0 0 0 0 rgba(122,193,66,.7); animation: pulse 1.8s infinite; }
  .live.off { color: #ffd0c9; } .live.off i { background: #ff7a6b; animation: none; }
  @keyframes pulse { to { box-shadow: 0 0 0 10px rgba(122,193,66,0); } }
  .ib { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; cursor: pointer; font-size: 18px; text-decoration: none; }
  .ib:hover { background: rgba(255,255,255,.16); }
  .stats { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; margin-top: 18px; }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .c b { display: block; font: 800 36px/1 "Bricolage Grotesque", sans-serif; }
  .ring .c small { font-size: 12px; color: rgba(255,255,255,.75); }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 10px 12px; }
  .kpi b { display: block; font: 800 22px/1.1 "Bricolage Grotesque", sans-serif; font-variant-numeric: tabular-nums; }
  .kpi span { display: block; font-size: 12px; line-height: 1.25; color: rgba(255,255,255,.78); }

  /* ---------- Recherche ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px calc(110px + env(safe-area-inset-bottom)); }
  .sbar { position: sticky; top: 0; z-index: 10; padding: 10px 0 6px; margin-top: -32px; }
  .sbar .hint { background: var(--bg); display: inline-block; padding: 2px 8px; border-radius: 8px; }
  input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid transparent; border-radius: 20px; padding: 6px 8px 6px 16px; box-shadow: 0 12px 30px rgba(13,45,74,.14); }
  .search:focus-within { border-color: var(--green); }
  .search svg { flex: none; width: 22px; height: 22px; color: var(--mute); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 19px; padding: 12px 0; }
  .search input::placeholder { color: #9aabbf; }
  .clr { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #eef3f8; cursor: pointer; font-size: 16px; }
  .hint { font-size: 14px; color: var(--mute); margin: 8px 4px 0; }
  .hint:empty { display: none !important; }

  /* ---------- Résultats ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 8px; }
  .resa { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 4px 14px rgba(13,45,74,.05); }
  .resa .rh { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 12px 16px; background: #f7fafd; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .resa .rh .sub { font-size: 13.5px; color: var(--ink2); }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.c { background: var(--okbg); color: var(--ok); } .pill.a { background: var(--warnbg); color: var(--warn); } .pill.x { background: var(--redbg); color: var(--red); }
  .who { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid #eef2f7; }
  .who:first-of-type { border-top: 0; }
  .av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 800 17px "Bricolage Grotesque", sans-serif; color: #fff; }
  .who .nm { font-weight: 800; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
  .who .ds { font-size: 13.5px; color: var(--mute); margin-top: 2px; overflow-wrap: anywhere; }
  .who.in { background: linear-gradient(90deg, var(--okbg), #fff 70%); }
  .go { min-width: 132px; min-height: 52px; border: 0; border-radius: 16px; background: var(--green); color: #0a1f38; font-weight: 800; font-size: 17px; cursor: pointer; box-shadow: 0 6px 16px rgba(122,193,66,.4); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .go:active { transform: scale(.97); }
  .go:disabled { opacity: .6; }
  .done { text-align: right; } .done b { display: block; color: var(--ok); font-size: 15px; } .done button { margin-top: 4px; border: 0; background: none; color: var(--mute); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .grp { margin: 0 16px 14px; width: calc(100% - 32px); min-height: 48px; border-radius: 14px; border: 2px dashed var(--green2); background: #f4fbee; color: #2f6a14; font-weight: 800; cursor: pointer; }
  .empty { text-align: center; padding: 40px 16px; color: var(--mute); }
  .empty .e { font-size: 44px; }

  /* ---------- Fil des arrivées ---------- */
  .feed h2 { font-size: 19px; margin: 22px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .feed h2 small { font: 600 13px "DM Sans", sans-serif; color: var(--mute); }
  .fl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .fl li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .fl .av { width: 40px; height: 40px; font-size: 14px; }
  .fl .tm { font-weight: 800; color: var(--ok); font-variant-numeric: tabular-nums; }

  /* ---------- Bouton inscription sur place ---------- */
  .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; border: 0; border-radius: 999px; padding: 0 22px; min-height: 58px; background: var(--navy); color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 14px 30px rgba(13,45,74,.35); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

  /* ---------- Succès ---------- */
  .flash { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(31,138,67,.92); color: #fff; text-align: center; padding: 24px; animation: fl .9s ease forwards; pointer-events: none; }
  .flash .ck { width: 96px; height: 96px; border-radius: 50%; background: #fff; color: var(--ok); display: grid; place-items: center; font-size: 54px; margin: 0 auto 14px; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .flash b { display: block; font: 800 28px "Bricolage Grotesque", sans-serif; } .flash span { opacity: .9; }
  @keyframes fl { 0%, 70% { opacity: 1; } 100% { opacity: 0; } } @keyframes pop { from { transform: scale(.4); } }

  /* ---------- Fenêtre inscription sur place ---------- */
  dialog { border: 0; padding: 0; width: min(560px, 100%); max-height: 92dvh; border-radius: 24px; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(8,20,36,.55); }
  .sheet { padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0; font-size: 22px; } .sheet p.sub { color: var(--mute); margin: 4px 0 14px; font-size: 14px; }
  .sheet label.l { display: block; font-weight: 800; font-size: 14px; margin: 14px 0 6px; }
  .sheet input.t, .sheet select.t { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; background: #f7fafd; font-size: 17px; }
  .sheet input.t:focus, .sheet select.t:focus { outline: none; border-color: var(--green); background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .accs .row { display: flex; gap: 8px; margin-top: 8px; } .accs .row input { flex: 1; }
  .xb { width: 48px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; }
  .add { margin-top: 8px; border: 1.5px dashed var(--line); background: none; border-radius: 14px; padding: 10px 14px; font-weight: 700; cursor: pointer; width: 100%; }
  .err { color: var(--red); font-size: 14px; min-height: 1.2em; margin-top: 10px; }
  .acts { display: flex; gap: 10px; margin-top: 14px; position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); background: var(--card); padding: 10px 0 calc(4px + env(safe-area-inset-bottom)); } .acts button { flex: 1; min-height: 54px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; }
  .b1 { border: 0; background: var(--green); color: #0a1f38; } .b2 { border: 1.5px solid var(--line); background: #fff; }

  /* ---------- Connexion ---------- */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: linear-gradient(140deg, #0a1f38, var(--navy2)); }
  .login form { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; padding: 26px; }
  .login img { height: 44px; } .login h1 { margin: 12px 0 4px; font-size: 26px; }
  .login label { display: block; font-weight: 800; font-size: 14px; margin: 14px 0 6px; }
  .login input { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; background: #f7fafd; font-size: 17px; }
  .login button { width: 100%; margin-top: 18px; min-height: 52px; border: 0; border-radius: 16px; background: var(--green); font-weight: 800; font-size: 17px; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 70; background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 700; max-width: calc(100% - 24px); box-shadow: 0 10px 30px rgba(0,0,0,.25); }

  /* Fenêtre de confirmation */
  dialog.ask { width: min(420px, calc(100% - 32px)); border-radius: 26px; text-align: center; box-shadow: 0 30px 80px rgba(8,20,36,.35); }
  dialog.ask[open] { animation: askIn .22s cubic-bezier(.2,1.2,.4,1); }
  @keyframes askIn { from { transform: translateY(14px) scale(.96); opacity: 0; } }
  dialog.ask::backdrop { background: rgba(8,20,36,.5); backdrop-filter: blur(3px); }
  .ask .bx { padding: 28px 22px 20px; }
  .ask .ic { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 34px; }
  .ask .ic.warn { background: var(--warnbg); } .ask .ic.red { background: var(--redbg); } .ask .ic.blue { background: #e8f1fb; }
  .ask h3 { margin: 0; font: 800 22px/1.2 "Bricolage Grotesque", sans-serif; color: var(--ink); }
  .ask p { margin: 8px 0 0; color: var(--ink2); font-size: 15.5px; }
  .ask .who2 { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 8px 14px 8px 8px; border-radius: 999px; background: #f2f6fb; font-weight: 800; }
  .ask .who2 .av { width: 34px; height: 34px; font-size: 13px; }
  .ask .bb { display: flex; gap: 10px; margin-top: 22px; }
  .ask .bb button { flex: 1; min-height: 52px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; }
  .ask .no { border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  .ask .yes { border: 0; background: var(--navy); color: #fff; } .ask .yes.red { background: var(--red); } .ask .yes.green { background: var(--green); color: #0a1f38; }
  @media (min-width: 900px) {
    .hero { padding-bottom: 34px; }
    .stats { grid-template-columns: auto minmax(0, 1fr); } .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
    .feed { position: sticky; top: 96px; } .feed h2 { margin-top: 14px; }
    .ring { width: 150px; height: 150px; }
  }
  @media (max-width: 420px) {
    .who { grid-template-columns: 42px minmax(0, 1fr); } .who .act { grid-column: 1 / -1; } .who .act .go { width: 100%; } .done { text-align: left; display: flex; align-items: center; justify-content: space-between; }
    .av { width: 42px; height: 42px; } .ring { width: 116px; height: 116px; } .ring .c b { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .flash, .flash .ck, .live i { animation: none; } }
</style>
</head>
<body>
<section class="login hidden" id="login">
  <form id="loginForm">
    <img src="../portrait/logos/bst-couleur.png" alt="Bwat Sekrèm Talks" />
    <h1>Pointage</h1>
    <p style="margin:0;color:var(--mute)">Accueil des participants · 22 novembre 2026</p>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required />
    <label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="loginBtn">Se connecter</button>
    <p class="err" id="loginMsg" role="alert"></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="hero"><div class="in">
    <div class="top">
      <img src="../portrait/logos/bst-blanc.png" alt="BST" />
      <div class="t"><b>Pointage</b><small><span class="live" id="live"><i></i> <span id="liveT">En direct</span></span> · <span id="clock"></span></small></div>
      <a class="ib" href="../" title="Espace inscriptions" aria-label="Espace inscriptions">↩</a>
      <button class="ib" type="button" id="logout" title="Déconnexion" aria-label="Déconnexion">⏻</button>
    </div>
    <div class="stats">
      <div class="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12" /><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#7AC142" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset .6s" /></svg>
        <div class="c"><div><b id="nIn">0</b><small id="nOf">sur 0</small></div></div></div>
      <div class="kpis" id="kpis"></div>
    </div>
  </div></header>

  <main>
    <div class="sbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Nom ou numéro WhatsApp…" aria-label="Rechercher une personne" />
        <button class="clr hidden" type="button" id="clr" aria-label="Effacer">✕</button></div>
      <p class="hint" id="hint"></p>
    </div>
    <div class="cols">
      <div class="grid" id="res"></div>
      <section class="feed"><h2>Dernières arrivées <small id="rate"></small></h2><ul class="fl" id="feed"></ul></section>
    </div>
  </main>
  <button class="fab" type="button" id="fab">＋ Inscription sur place</button>
</div>

<dialog id="dlg"><form class="sheet" id="sf" novalidate>
  <h2>Inscription sur place</h2>
  <p class="sub">La personne est inscrite et marquée présente tout de suite.</p>
  <label class="l" for="sNom">Nom complet *</label><input class="t" id="sNom" autocomplete="off" maxlength="150" />
  <label class="l">Sexe</label><div class="chips" data-one="sexe"><button type="button" class="chip" data-v="femme">Femme</button><button type="button" class="chip" data-v="homme">Homme</button></div>
  <label class="l" for="sTel">Téléphone / WhatsApp *</label><input class="t" id="sTel" type="tel" inputmode="tel" autocomplete="off" placeholder="ex. 4901 2257" maxlength="25" />
  <label class="l">Profil</label><div class="chips" data-many="profils"><button type="button" class="chip" data-v="etudiant">Étudiant(e)</button><button type="button" class="chip" data-v="employe">Employé(e)</button><button type="button" class="chip" data-v="cadre">Cadre / Dirigeant(e)</button><button type="button" class="chip" data-v="proprietaire">Propriétaire</button><button type="button" class="chip" data-v="autre">Autre</button></div>
  <div id="sUniW" class="hidden"><label class="l" for="sUni">Université</label><select class="t" id="sUni"></select><input class="t hidden" id="sUniA" placeholder="Nom de l’université" style="margin-top:8px" maxlength="200" /></div>
  <label class="l" for="sVille">Ville</label><input class="t" id="sVille" autocomplete="off" maxlength="120" placeholder="ex. Cap-Haïtien" />
  <label class="l">Personnes qui l’accompagnent <span style="font-weight:500;color:var(--mute)">(facultatif, 4 max.)</span></label>
  <div class="accs" id="sAccs"></div><button type="button" class="add" id="sAdd">＋ Ajouter une personne</button>
  <p class="err" id="sErr" role="alert"></p>
  <div class="acts"><button type="button" class="b2" id="sCancel">Annuler</button><button type="submit" class="b1" id="sOk">Inscrire et pointer ✓</button></div>
</form></dialog>
<dialog class="ask" id="ask" aria-labelledby="askT"><div class="bx">
  <div class="ic" id="askI"></div><h3 id="askT"></h3><p id="askP"></p><div id="askW"></div>
  <div class="bb"><button type="button" class="no" id="askNo">Annuler</button><button type="button" class="yes" id="askYes">Confirmer</button></div>
</div></dialog>
<div class="toast hidden" id="toast" role="status"></div>

<script>
const sb = window.supabase.createClient('https://nltlgytehikguydcdhyy.supabase.co', 'sb_publishable_ncDXEDbAodI2yxhwlTrnwg_M4SvBqly');
const EDITION = '2026-11-22-cap-haitien';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plain = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const digits = (v) => String(v || '').replace(/\D/g, '');
const local8 = (v) => { let d = digits(v); if (d.startsWith('00')) d = d.slice(2); if (d.length > 8 && d.startsWith('509')) d = d.slice(3); return d; };
const hm = (d) => new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const PROFILS = { etudiant: 'Étudiant(e)', employe: 'Employé(e)', cadre: 'Cadre / Dirigeant(e)', proprietaire: 'Propriétaire', autre: 'Autre' };
const UNIS = ['UPNCH', 'URHC', 'UNDH', 'UCNH', 'CHCL/UEH', 'UNAF', 'FDSEG/UEH', 'UNATH', 'EMMAÜS', 'UGNH'];
const COL = ['#2f8fe8', '#5DB033', '#7c4dff', '#ff8a00', '#e8436b', '#0D2D4A', '#0aa3a3'];
const avc = (n) => COL[[...String(n || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % COL.length];
const ini = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
let TT = null; const toast = (m, ms = 3500) => { $('toast').textContent = m; $('toast').classList.remove('hidden'); clearTimeout(TT); TT = setTimeout(() => $('toast').classList.add('hidden'), ms); };
const friendly = (e) => { const m = String(e?.message || e || ''); console.warn(e);
  if (/fetch|network|load failed/i.test(m)) return 'Pas de connexion internet. Réessayez dans un instant.';
  if (/jwt|session|expired/i.test(m)) return 'Session expirée : reconnectez-vous.';
  if (/permission|row-level|42501/i.test(m)) return 'Ce compte n’a pas l’autorisation de pointer.';
  if (/déjà|numéro|nom|téléphone|e-mail|réservation/i.test(m)) return m;
  return 'Erreur inattendue, réessayez.'; };

/* Fenêtre de confirmation (remplace la boîte du navigateur) */
function ask({ icon = '❔', tone = 'blue', title, text = '', person = null, ok = 'Confirmer', okTone = '', cancel = 'Annuler' }) {
  return new Promise((resolve) => {
    const d = $('ask');
    $('askI').className = 'ic ' + tone; $('askI').textContent = icon; $('askT').textContent = title; $('askP').textContent = text; $('askP').classList.toggle('hidden', !text);
    $('askW').innerHTML = person ? `<span class="who2"><span class="av" style="background:${avc(person)}">${esc(ini(person))}</span>${esc(person)}</span>` : '';
    $('askYes').textContent = ok; $('askYes').className = 'yes ' + okTone; $('askNo').textContent = cancel;
    const done = (v) => { d.close(); $('askYes').onclick = $('askNo').onclick = d.oncancel = null; resolve(v); };
    $('askYes').onclick = () => done(true); $('askNo').onclick = () => done(false); d.oncancel = (e) => { e.preventDefault(); done(false); };
    d.onclick = (e) => { if (e.target === d) done(false); };
    d.showModal(); setTimeout(() => $('askYes').focus(), 30);
  });
}

/* ---------- Données ---------- */
let ROWS = [], SUI = {}, PRES = {}, ONLINE = true;
const kOf = (p) => `${p.rid}:${p.idx}`;
function people(rows) {
  const out = [];
  for (const r of [...rows].sort((a, b) => a.created_at.localeCompare(b.created_at))) {
    const st = r.annule ? 'x' : r.confirme ? 'c' : 'a';
    out.push({ rid: r.id, idx: -1, r, nom: r.nom, sexe: r.sexe, tel: r.telephone, profils: r.profils || [], st, by: null, uni: r.universite,
      det: [r.universite, r.employe_entreprise, r.cadre_entreprise, r.proprietaire_entreprise].filter(Boolean).join(' · ') });
    (r.accompagnants || []).forEach((a, i) => { const s = SUI[`${r.id}:${i}`]?.statut;
      out.push({ rid: r.id, idx: i, r, nom: a.nom, sexe: a.sexe, tel: a.telephone || '', profils: a.profil ? [a.profil] : [], by: r.nom, uni: a.universite,
        st: r.annule ? 'x' : s || (digits(a.telephone).length >= 8 ? 'a' : st), det: [a.universite, a.entreprise].filter(Boolean).join(' · ') }); });
  }
  return out;
}
let ALLP = [];
async function load(quiet) {
  const [ins, sui, pr] = await Promise.all([
    sb.from('talks_inscriptions').select('*').eq('edition', EDITION),
    sb.from('talks_suivi_accompagnants').select('*'),
    sb.from('talks_presences').select('*'),
  ]);
  const err = ins.error || pr.error;
  setOnline(!err);
  if (err) { if (!quiet) toast(friendly(err), 6000); return; }
  ROWS = ins.data || []; SUI = Object.fromEntries((sui.data || []).map((s) => [`${s.inscription_id}:${s.idx}`, s]));
  PRES = Object.fromEntries((pr.data || []).map((x) => [`${x.inscription_id}:${x.idx}`, x]));
  ALLP = people(ROWS); render();
}
function setOnline(on) { ONLINE = on; $('live').classList.toggle('off', !on); $('liveT').textContent = on ? 'En direct' : 'Hors ligne'; }

/* ---------- Affichage ---------- */
const isIn = (p) => PRES[kOf(p)];
function render() {
  const exp = ALLP.filter((p) => p.st !== 'x'), inn = ALLP.filter(isIn), conf = exp.filter((p) => p.st === 'c');
  const pct = exp.length ? inn.length / exp.length : 0;
  $('nIn').textContent = inn.length; $('nOf').textContent = `sur ${exp.length} attendus`;
  $('arc').style.strokeDashoffset = String(326.7 * (1 - Math.min(1, pct)));
  const last15 = inn.filter((x) => Date.now() - new Date(x && PRES[kOf(x)].present_le) < 15 * 60000).length;
  $('kpis').innerHTML = [
    [`${Math.round(pct * 100)} %`, 'de la salle attendue'],
    [exp.length - exp.filter(isIn).length, 'encore attendus'],
    [`${conf.filter(isIn).length}/${conf.length}`, 'confirmés arrivés'],
    [`${inn.filter((p) => p.sexe === 'femme').length} · ${inn.filter((p) => p.sexe === 'homme').length}`, 'femmes · hommes'],
  ].map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
  $('rate').textContent = last15 ? `${last15} en 15 min` : '';
  renderRes(); renderFeed();
}
function personHTML(p, q) {
  const pr = isIn(p);
  const ds = [p.sexe === 'femme' ? 'Femme' : p.sexe === 'homme' ? 'Homme' : '', p.profils.map((k) => PROFILS[k] || k).join(', '), p.tel, p.det].filter(Boolean).join(' · ');
  return `<div class="who ${pr ? 'in' : ''}"><div class="av" style="background:${avc(p.nom)}">${esc(ini(p.nom))}</div>
    <div><div class="nm">${esc(p.nom || '—')}</div><div class="ds">${esc(ds || (p.by ? 'avec ' + p.by : ''))}</div></div>
    <div class="act">${pr ? `<div class="done"><b>✓ Arrivé(e) · ${esc(hm(pr.present_le))}</b><button type="button" data-out="${kOf(p)}">Annuler la présence</button></div>`
      : `<button class="go" type="button" data-in="${kOf(p)}">✓ Présent</button>`}</div></div>`;
}
function renderRes() {
  const q = $('q').value.trim(); $('clr').classList.toggle('hidden', !q);
  if (!q) { $('res').innerHTML = `<div class="empty"><div class="e">👋</div><b>Qui arrive ?</b><br>Tapez son nom ou les 4 derniers chiffres de son numéro WhatsApp.</div>`; $('hint').textContent = ''; return; }
  const ql = plain(q), qd = local8(q);
  const hit = ALLP.filter((p) => plain(p.nom).includes(ql) || (qd.length >= 4 && (local8(p.tel).includes(qd) || local8(p.r.telephone).includes(qd))));
  const ids = [...new Set(hit.map((p) => p.rid))].slice(0, 8);
  $('hint').textContent = ids.length ? `${ids.length} réservation${ids.length > 1 ? 's' : ''} trouvée${ids.length > 1 ? 's' : ''}` : '';
  if (!ids.length) { $('res').innerHTML = `<div class="empty"><div class="e">🔎</div><b>Personne trouvée</b><br>Essayez une autre partie du nom ou les 4 derniers chiffres du numéro.<br><br>Pas inscrit(e) ? Utilisez « ＋ Inscription sur place ».</div>`; return; }
  $('res').innerHTML = ids.map((id) => {
    const grp = ALLP.filter((p) => p.rid === id), r = grp[0].r, miss = grp.filter((p) => !isIn(p));
    const pill = r.annule ? '<span class="pill x">Réservation annulée</span>' : r.confirme ? '<span class="pill c">✓ Confirmée</span>' : '<span class="pill a">Non confirmée</span>';
    return `<article class="resa"><div class="rh"><div><b>${esc(r.nom)}</b> <span class="sub">· ${grp.length > 1 ? `${grp.length} places` : '1 place'}</span></div>${pill}</div>
      ${grp.map((p) => personHTML(p, q)).join('')}
      ${grp.length > 1 && miss.length > 1 ? `<button class="grp" type="button" data-grp="${id}">✓ Tout le groupe est là (${miss.length})</button>` : ''}</article>`;
  }).join('');
}
function renderFeed() {
  const L = ALLP.filter(isIn).sort((a, b) => new Date(isIn(b).present_le) - new Date(isIn(a).present_le)).slice(0, 12);
  $('feed').innerHTML = L.map((p) => `<li><div class="av" style="background:${avc(p.nom)}">${esc(ini(p.nom))}</div><div><b>${esc(p.nom)}</b>${p.by ? `<div class="ds" style="font-size:12.5px;color:var(--mute)">avec ${esc(p.by)}</div>` : ''}</div><span class="tm">${esc(hm(isIn(p).present_le))}</span></li>`).join('')
    || '<li style="display:block;text-align:center;color:var(--mute)">Personne n’est encore arrivé.</li>';
}

/* ---------- Pointer ---------- */
async function setIn(p, on) {
  const row = { inscription_id: p.rid, idx: p.idx };
  if (on) {
    if (isIn(p)) return true;
    PRES[kOf(p)] = { ...row, present_le: new Date().toISOString() }; render();   // affichage immédiat
    const { data, error } = await sb.from('talks_presences').upsert(row, { onConflict: 'inscription_id,idx', ignoreDuplicates: true }).select();
    if (error) { delete PRES[kOf(p)]; render(); toast('Présence non enregistrée : ' + friendly(error), 6000); setOnline(false); return false; }
    if (data && data[0]) PRES[kOf(p)] = data[0];
  } else {
    const old = PRES[kOf(p)]; delete PRES[kOf(p)]; render();
    const { error } = await sb.from('talks_presences').delete().eq('inscription_id', row.inscription_id).eq('idx', row.idx);
    if (error) { PRES[kOf(p)] = old; render(); toast(friendly(error)); return false; }
  }
  setOnline(true); return true;
}
function flash(t, s) {
  const d = document.createElement('div'); d.className = 'flash'; d.innerHTML = `<div><div class="ck">✓</div><b>${esc(t)}</b><span>${esc(s || 'Bienvenue à Bwat Sekrèm Talks !')}</span></div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 950);
  try { navigator.vibrate && navigator.vibrate(60); } catch {}
}
const byK = (k) => ALLP.find((p) => kOf(p) === k);
function nextOne(rid) { if (ALLP.filter((x) => x.rid === rid).every(isIn)) setTimeout(() => { $('q').value = ''; renderRes(); $('q').focus(); }, 900); }
document.addEventListener('click', async (e) => {
  const a = e.target.closest('[data-in]');
  if (a) { const p = byK(a.dataset.in); if (!p) return;
    if (p.st === 'x' && !(await ask({ icon: '⚠️', tone: 'warn', title: 'Réservation annulée', text: 'Sa place avait été libérée. Voulez-vous quand même la marquer présente ?', person: p.nom, ok: '✓ Pointer', okTone: 'green' }))) return;
    a.disabled = true; if (await setIn(p, true)) { flash(p.nom.split(' ')[0], p.by ? `avec ${p.by}` : ''); nextOne(p.rid); } return; }
  const o = e.target.closest('[data-out]');
  if (o) { const p = byK(o.dataset.out); if (p && (await ask({ icon: '↩️', tone: 'red', title: 'Retirer la présence ?', text: `Arrivé(e) à ${hm(isIn(p).present_le)}. À utiliser seulement en cas d’erreur de pointage.`, person: p.nom, ok: 'Retirer', okTone: 'red', cancel: 'Garder' }))) { await setIn(p, false); toast(`Présence de ${p.nom} retirée`); } return; }
  const g = e.target.closest('[data-grp]');
  if (g) { g.disabled = true; const L = ALLP.filter((p) => p.rid === Number(g.dataset.grp) && !isIn(p) && p.st !== 'x'); let n = 0;
    for (const p of L) if (await setIn(p, true)) n++;
    if (n) { flash(`${n} personne${n > 1 ? 's' : ''}`, `Groupe de ${L[0].r.nom}`); nextOne(Number(g.dataset.grp)); } }
});
$('q').addEventListener('input', renderRes);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = document.querySelectorAll('[data-in]'); if (b.length === 1) b[0].click(); } });
$('clr').addEventListener('click', () => { $('q').value = ''; renderRes(); $('q').focus(); });

/* ---------- Inscription sur place ---------- */
let SF = { sexe: '', profils: [], accs: [] };
$('sUni').innerHTML = '<option value="">—</option>' + UNIS.map((u) => `<option>${u}</option>`).join('') + '<option value="__autre">Autre université…</option>';
function sfRender() {
  document.querySelectorAll('[data-one="sexe"] .chip').forEach((c) => c.classList.toggle('on', SF.sexe === c.dataset.v));
  document.querySelectorAll('[data-many="profils"] .chip').forEach((c) => c.classList.toggle('on', SF.profils.includes(c.dataset.v)));
  $('sUniW').classList.toggle('hidden', !SF.profils.includes('etudiant')); $('sUniA').classList.toggle('hidden', $('sUni').value !== '__autre');
  $('sAccs').innerHTML = SF.accs.map((a, i) => `<div class="row"><input class="t" data-acc="${i}" value="${esc(a)}" placeholder="Nom de la personne ${i + 2}" maxlength="150" /><button type="button" class="xb" data-accx="${i}" aria-label="Retirer">✕</button></div>`).join('');
  $('sAdd').classList.toggle('hidden', SF.accs.length >= 4);
}
const readAccs = () => { SF.accs = [...document.querySelectorAll('[data-acc]')].map((x) => x.value); };
$('fab').addEventListener('click', () => { SF = { sexe: '', profils: [], accs: [] }; $('sf').reset(); $('sErr').textContent = ''; sfRender(); $('dlg').showModal(); setTimeout(() => $('sNom').focus(), 60); });
$('sCancel').addEventListener('click', () => $('dlg').close());
$('sf').addEventListener('click', (e) => {
  const one = e.target.closest('[data-one] .chip'); if (one) { readAccs(); SF.sexe = SF.sexe === one.dataset.v ? '' : one.dataset.v; sfRender(); return; }
  const many = e.target.closest('[data-many] .chip'); if (many) { readAccs(); const v = many.dataset.v; SF.profils = SF.profils.includes(v) ? SF.profils.filter((x) => x !== v) : [...SF.profils, v]; sfRender(); return; }
  const x = e.target.closest('[data-accx]'); if (x) { readAccs(); SF.accs.splice(Number(x.dataset.accx), 1); sfRender(); }
});
$('sAdd').addEventListener('click', () => { readAccs(); SF.accs.push(''); sfRender(); document.querySelector(`[data-acc="${SF.accs.length - 1}"]`)?.focus(); });
$('sUni').addEventListener('change', sfRender);
$('sf').addEventListener('submit', async (e) => {
  e.preventDefault(); readAccs();
  const nom = $('sNom').value.trim(), tel = $('sTel').value.trim(), accs = SF.accs.map((a) => a.trim()).filter(Boolean);
  if (nom.length < 2) { $('sErr').textContent = 'Indiquez le nom complet.'; $('sNom').focus(); return; }
  if (digits(tel).length < 8 || digits(tel).length > 15) { $('sErr').textContent = 'Numéro WhatsApp invalide (8 chiffres minimum).'; $('sTel').focus(); return; }
  if (accs.some((a) => a.length < 2)) { $('sErr').textContent = 'Indiquez le nom de chaque personne ajoutée.'; return; }
  const uni = SF.profils.includes('etudiant') ? ($('sUni').value === '__autre' ? $('sUniA').value.trim() : $('sUni').value) : '';
  const row = { edition: EDITION, nom, telephone: tel, sexe: SF.sexe || null, ville: $('sVille').value.trim() || null, source: 'Sur place (jour J)',
    profils: SF.profils.length ? SF.profils : null, universite: uni || null, places: 1 + accs.length, accompagnants: accs.map((n) => ({ nom: n })) };
  $('sOk').disabled = true; $('sErr').textContent = '';
  const { data, error } = await sb.from('talks_inscriptions').insert(row).select().single();
  $('sOk').disabled = false;
  if (error) { $('sErr').textContent = friendly(error); return; }
  ROWS.push(data); ALLP = people(ROWS);
  let n = 0; for (const p of ALLP.filter((x) => x.rid === data.id)) if (await setIn(p, true)) n++;
  $('dlg').close(); flash(nom.split(' ')[0], n > 1 ? `Inscrit(e) sur place avec ${n - 1} personne${n > 2 ? 's' : ''}` : 'Inscrit(e) sur place');
  $('q').value = nom; renderRes();
});

/* ---------- Horloge, synchro, connexion ---------- */
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
setInterval(tick, 10000); tick();
setInterval(() => { if (!document.hidden && !$('app').classList.contains('hidden') && !$('dlg').open) load(true); }, 10000);   // plusieurs téléphones à l'entrée
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').classList.contains('hidden')) load(true); });
addEventListener('online', () => load(true)); addEventListener('offline', () => setOnline(false));
async function show(session) {
  if (!session) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  const { data: wol } = await sb.rpc('talks_mon_wol');
  if (wol !== 'admin') { await sb.auth.signOut(); $('login').classList.remove('hidden'); $('app').classList.add('hidden'); $('loginMsg').textContent = 'Ce compte n’a pas accès au pointage.'; return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); await load(); $('q').focus();
}
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('loginBtn').disabled = true; $('loginMsg').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('loginBtn').disabled = false; if (error) { $('loginMsg').textContent = 'E-mail ou mot de passe incorrect.'; return; }
  show(data.session);
});
$('logout').addEventListener('click', async () => { if (!(await ask({ icon: '👋', title: 'Se déconnecter ?', text: 'Vous devrez vous reconnecter pour continuer à pointer.', ok: 'Se déconnecter' }))) return; await sb.auth.signOut(); show(null); });
sb.auth.getSession().then(({ data }) => show(data.session));
</script>
