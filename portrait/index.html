    + `<button type="button" class="opt ask" id="askBtn" aria-expanded="${!$('reqBox').classList.contains('hidden')}"><span class="e">➕</span>${t().ask}</button>`;

/* ----- Photo : réduite à 1024 px avant envoi (plus rapide, moins cher) ----- */
function check2() { $('go2').disabled = !(S.photo && $('ok').checked && $('tel').value.replace(/\D/g, '').length >= 8 && S.left > 0); }
['ok', 'tel', 'prenom'].forEach((id) => $(id).addEventListener('input', check2));
$('file').addEventListener('change', () => {
  const f = $('file').files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    S.photoURL = c.toDataURL('image/jpeg', 0.88);
    S.photo = new Image(); S.photo.src = S.photoURL;
    $('thumb').src = S.photoURL; $('genThumb').src = S.photoURL; $('err2').textContent = '';
    URL.revokeObjectURL(img.src); check2();
  };
  img.onerror = () => { $('err2').textContent = t().errPhoto; };
  img.src = URL.createObjectURL(f);
});

  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'api');
  if (typeof j.left === 'number') S.left = j.left + 1;   // décrémenté juste après
  const img = new Image(); img.src = 'data:' + (j.mime || 'image/png') + ';base64,' + j.image;
  await img.decode(); return img;
}

/* Démo : simple recadrage 4:5 + lumière « studio », sans IA */
async function demoPortrait() {
  await new Promise((r) => setTimeout(r, 2600));
  const W = 1024, H = 1280, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), im = S.photo;
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5b6f86'); g.addColorStop(1, '#25384f');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const k = Math.max(W / im.width, H / im.height);
  x.filter = 'contrast(1.08) saturate(1.06) brightness(1.03)';
  x.drawImage(im, (W - im.width * k) / 2, (H - im.height * k) / 2 * 0.6, im.width * k, im.height * k);
  x.filter = 'none';
  const v = x.createRadialGradient(W / 2, H * 0.42, W * 0.3, W / 2, H * 0.5, W * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(5,15,30,.45)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  const out = new Image(); out.src = c.toDataURL('image/jpeg', 0.92); await out.decode(); return out;
}

/* ===================== Cadre à partager ===================== */
const IMG = {};
const load = (k, src) => new Promise((res) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => res(); i.src = src; });
function rr(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function fit(x, text, font, max, size) { let s = size; do { x.font = font.replace('{s}', s); s -= 2; } while (x.measureText(text).width > max && s > 20); return s + 2; }
function drawLogo(x, img, cx, cy, h) { if (!img) return 0; const w = img.width * (h / img.height); x.drawImage(img, cx - w / 2, cy - h / 2, w, h); return w; }

function drawCard() {
  if (!S.result) return;
  const story = S.fmt === 'story', W = 1080, H = story ? 1920 : 1350;
  const cv = $('cv'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
  const c = t().card, prenom = ($('prenom').value || '').trim().split(/\s+/)[0].slice(0, 18);
  // fond
  const bg = x.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#0f2b4b'); bg.addColorStop(1, '#071629');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  x.globalAlpha = .08; x.strokeStyle = '#d8b25a'; x.lineWidth = 2;
  for (let i = -H; i < W; i += 46) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + H, H); x.stroke(); }
  x.globalAlpha = 1;
  // en-tête
  const top = story ? 120 : 64;
  drawLogo(x, IMG.bst, W / 2, top + 34, 68);
  // photo
  const pw = story ? 820 : 600, ph = pw * 1.25, px = (W - pw) / 2, py = top + (story ? 150 : 124);
  x.save(); x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 40; x.shadowOffsetY = 18;
  rr(x, px - 12, py - 12, pw + 24, ph + 24, 40); x.fillStyle = '#d8b25a'; x.fill(); x.restore();
  const gold = x.createLinearGradient(px, py, px + pw, py + ph); gold.addColorStop(0, '#f3dc9a'); gold.addColorStop(.5, '#c99a3e'); gold.addColorStop(1, '#f3dc9a');
  rr(x, px - 12, py - 12, pw + 24, ph + 24, 40); x.fillStyle = gold; x.fill();
  x.save(); rr(x, px, py, pw, ph, 30); x.clip();
  const im = S.result, k = Math.max(pw / im.width, ph / im.height);
  x.drawImage(im, px + (pw - im.width * k) / 2, py + (ph - im.height * k) / 2, im.width * k, im.height * k);
  const sh = x.createLinearGradient(0, py + ph * .62, 0, py + ph); sh.addColorStop(0, 'rgba(7,22,41,0)'); sh.addColorStop(1, 'rgba(7,22,41,.92)');
  x.fillStyle = sh; x.fillRect(px, py, pw, ph);
  x.restore();
  // ruban kicker
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = '700 26px "DM Sans"'; const kw = x.measureText(c.kick).width + 60;
  rr(x, W / 2 - kw / 2, py - 34, kw, 50, 25); x.fillStyle = '#0a1f38'; x.fill(); x.strokeStyle = '#d8b25a'; x.lineWidth = 3; x.stroke();
  x.fillStyle = '#f3dc9a'; x.fillText(c.kick, W / 2, py - 0);
  // nom + métier sur la photo
  const title = profTitle();
  if (prenom) { x.fillStyle = '#fff'; fit(x, prenom, 'italic 500 {s}px "Playfair Display"', pw - 80, 58); x.fillText(prenom, W / 2, py + ph - 118); }
  x.fillStyle = '#f3dc9a'; fit(x, title.toUpperCase(), '800 {s}px "Bricolage Grotesque"', pw - 60, 84); x.fillText(title.toUpperCase(), W / 2, py + ph - 38);
  // bloc événement
  let y = py + ph + (story ? 110 : 78);
  x.fillStyle = '#c9d8ea'; x.font = '500 30px "DM Sans"'; x.fillText(c.will, W / 2, y);
  y += story ? 70 : 60; x.fillStyle = '#fff'; fit(x, 'BWAT SEKRÈM TALKS', '800 {s}px "Bricolage Grotesque"', W - 160, 64); x.fillText('BWAT SEKRÈM TALKS', W / 2, y);
  y += story ? 54 : 46; x.fillStyle = '#8cc63f'; x.font = '700 28px "DM Sans"'; x.fillText(c.date, W / 2, y);
  if (story) {
    y += 46; x.fillStyle = '#c9d8ea'; x.font = '500 26px "DM Sans"'; x.fillText(c.place, W / 2, y);
    y += 52; x.fillStyle = '#f3dc9a'; x.font = 'italic 500 32px "Playfair Display"'; x.fillText('« ' + c.theme + ' »', W / 2, y);
  }
  // pied : CTA + partenaires
  const fy = H - 150;
  x.font = '700 26px "DM Sans"'; const cta = `${c.cta} ${SITE}`; const cw = Math.min(x.measureText(cta).width + 56, W - 80);
  if (story) { rr(x, W / 2 - cw / 2, fy - 110, cw, 60, 30); x.fillStyle = '#d8b25a'; x.fill(); x.fillStyle = '#0a1f38'; fit(x, cta, '700 {s}px "DM Sans"', cw - 40, 26); x.fillText(cta, W / 2, fy - 71); }
  x.fillStyle = '#8aa0bb'; x.font = '600 18px "DM Sans"'; x.fillText(c.support.toUpperCase(), W / 2, fy - 10);
  const lh = story ? 62 : 54;
  x.save(); rr(x, W / 2 - 230, fy + 6, 460, lh + 20, 18); x.fillStyle = '#fff'; x.fill(); x.restore();
  drawLogo(x, IMG.zl, W / 2 - 115, fy + 16 + lh / 2, lh); drawLogo(x, IMG.ml, W / 2 + 115, fy + 16 + lh / 2, lh);
  if (!story) { x.fillStyle = '#d8b25a'; fit(x, cta, '700 {s}px "DM Sans"', W - 120, 26); x.fillText(cta, W / 2, H - 30); }
  $('preview').src = cv.toDataURL('image/jpeg', 0.9);
  $('preview').className = 'preview' + (story ? ' story' : '');
  $('preview').alt = `${prenom || ''} ${title} — Bwat Sekrèm Talks`;
}

/* ----- Partage ----- */
const blob = () => new Promise((r) => $('cv').toBlob(r, 'image/jpeg', 0.92));
const fname = () => `portrait-pro-${S.prof}-${S.fmt}.jpg`;
$('dl').addEventListener('click', async () => { const a = document.createElement('a'); a.href = URL.createObjectURL(await blob()); a.download = fname(); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
$('share').addEventListener('click', async () => {
  const text = t().shareText(profTitle());
  const file = new File([await blob()], fname(), { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
});

/* ----- Acheter d'autres portraits ----- */
var PACK = null, QUOTA_ERR = false, CODE_LINK = false;
function renderBuy() {
  const show3 = !$('s3').classList.contains('hidden');
  $('buy').classList.toggle('hidden', !((S.left <= 0 && (show3 || QUOTA_ERR)) || CODE_LINK));
  $('packs').innerHTML = PACKS.map((k) => `<button type="button" class="pack" data-pack="${k.n}" aria-pressed="${PACK === k.n}">${k.tag ? `<em>${k.tag === 'save' ? t().tagSave : t().tagBest}</em>` : ''}<b>${k.n}</b><span>${t().pk(k.n)}</span><strong>${k.p} G</strong></button>`).join('');
  const k = PACKS.find((x) => x.n === PACK);
  $('howto').classList.toggle('hidden', !k);
  if (k) {
    $('howtoList').innerHTML = t().steps(k.p).map((x) => `<li>${x}</li>`).join('');
    $('buyWa').textContent = t().waBtn;
    $('buyWa').href = `https://wa.me/${WA_PAIEMENT}?text=${encodeURIComponent(t().waMsg(k.n, k.p, $('tel').value.trim() || $('ctel').value.trim()))}`;
  }
  $('redeem').textContent = t().redeem;
  if (!$('ctel').value && $('tel').value) $('ctel').value = $('tel').value;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-pack]'); if (b) { PACK = Number(b.dataset.pack); renderBuy(); } });
$('redeem').addEventListener('click', async () => {
  const code = $('code').value.trim(), tel = $('ctel').value.trim();
  const msg = (txt, ok) => { $('cMsg').textContent = txt; $('cMsg').classList.toggle('ok-msg', !!ok); };
  if (!code) return msg(t().cErr.empty);
  if (tel.replace(/\D/g, '').length < 8) return msg(t().errTel);
  $('redeem').disabled = true;
  let j;
  if (S.demo) {   // démo : tout code au bon format débloque 3 portraits
    await new Promise((r) => setTimeout(r, 500));
    j = /^BST-?[A-Z0-9]{4}-?[A-Z0-9]{4}$/i.test(code) ? { ok: true, photos: 3, left: S.left + 3 } : { ok: false, error: 'coupon_invalide' };
  } else {
    try {
      const r = await fetch(`${DB_URL}/rest/v1/rpc/portrait_utiliser_coupon`, { method: 'POST', headers: { apikey: DB_KEY, Authorization: `Bearer ${DB_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code, p_tel: tel }) });
      j = r.ok ? await r.json() : { ok: false, error: 'api' };
    } catch { j = { ok: false, error: 'api' }; }
  }
  $('redeem').disabled = false;
  if (!j.ok) return msg(t().cErr[j.error] || ({ not_registered: t().errNotReg, bad_tel: t().errTel })[j.error] || t().errApi);
  S.left = j.left; QUOTA_ERR = false; CODE_LINK = false; $('code').value = '';
  if (!$('tel').value) $('tel').value = tel;
  msg(t().cOk(j.photos), true);
  $('again').classList.remove('hidden'); $('again').textContent = t().again2; $('left').textContent = t().left(S.left);
  $('err2').textContent = ''; keep(); check2();
});

/* ----- Le portrait est gardé sur le téléphone (1 seul par personne) ----- */
const KEEP = 'bst_portrait_v1';
function keep() {
  try {
    const c = document.createElement('canvas'), im = S.result, k = Math.min(1, 900 / im.width);
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    localStorage.setItem(KEEP, JSON.stringify({ img: c.toDataURL('image/jpeg', 0.85), prof: S.prof, g: S.g, prenom: $('prenom').value, tel: $('tel').value, left: S.left, demo: S.demo }));
  } catch {}
}
async function restore() {
  let k = null; try { k = JSON.parse(localStorage.getItem(KEEP) || 'null'); } catch {}
  if (!k || !k.img || !PROFS.some((p) => p.k === k.prof)) return;
  const im = new Image(); im.src = k.img; try { await im.decode(); } catch { return; }
  Object.assign(S, { result: im, prof: k.prof, g: k.g || 'f', left: k.left ?? 0, demo: !!k.demo }); $('prenom').value = k.prenom || ''; $('tel').value = k.tel || '';
  $('demoNote').classList.toggle('hidden', !S.demo); $('again').classList.toggle('hidden', S.left <= 0);
  setLang(S.lang); show('s3');
}

/* ----- Démarrage ----- */
const q = new URLSearchParams(location.search);
let lang0 = q.get('lang'); try { lang0 = lang0 || localStorage.getItem('bst_lang'); } catch {}
lang0 = lang0 || ((navigator.language || '').startsWith('en') ? 'en' : 'fr');
if (q.get('prenom')) $('prenom').value = q.get('prenom').slice(0, 24);
if (q.get('tel')) $('tel').value = q.get('tel');
if (q.get('code')) { $('code').value = q.get('code').slice(0, 20).toUpperCase(); CODE_LINK = true; }
setLang(lang0);
if (CODE_LINK) setTimeout(() => $('buy').scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
const FONTS = ['800 50px "Bricolage Grotesque"', '700 50px "DM Sans"', '600 50px "DM Sans"', '500 50px "DM Sans"', 'italic 500 50px "Playfair Display"'];
Promise.all([...FONTS.map((f) => document.fonts.load(f).catch(() => {})), load('bst', 'logos/bst-blanc.png'), load('zl', 'logos/zero-loss.png'), load('ml', 'logos/mache-lokal-no.png')]).then(() => { if (S.result) drawCard(); else restore(); });
