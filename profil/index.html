  $('types').innerHTML = ['M', 'L', 'I', 'D', 'B'].map((k) => `<div class="type"><span>${EMO[k]}</span>${L().profils[k].short}</div>`).join('');
  document.querySelector('[data-fmt="story"]').textContent = L().fmtStory; document.querySelector('[data-fmt="post"]').textContent = L().fmtPost;
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderUnis();
  $('teambar').classList.toggle('on', !!st.team); if (st.team) $('teambar').textContent = L().teamBanner(st.team);
  try { localStorage.setItem('bst_quiz_lang', lang); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  if ($('s-quiz').classList.contains('on')) renderQ();
  if ($('s-result').classList.contains('on')) result(true);
  if ($('s-team').classList.contains('on')) renderDash();
  if (st.total) showSocial();
}
const SOCIAL_MIN = 30;   // le compteur (réel) n'apparaît qu'à partir de 30 tests
function showSocial() { const el = $('social'); if (st.total >= SOCIAL_MIN) { el.textContent = L().social(st.total); el.style.display = 'block'; } }
sbRpc('quiz_total').then((n) => { st.total = Number(n) || 0; showSocial(); }).catch(() => {});
document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* =================== TEST D'ÉQUIPE =================== */
$('toTeam').addEventListener('click', () => show('s-team-create'));
$('teamBack').addEventListener('click', () => show('s-intro'));
$('makeTeam').addEventListener('click', () => {
  const n = $('teamName').value.trim().replace(/\s+/g, ' '); if (!n) { $('teamName').focus(); return; }
  $('teamUrl').value = shareUrl({ equipe: n }); $('teamOut').style.display = 'block'; st.pendingTeam = n;
});
async function copy(input, btn) { try { await navigator.clipboard.writeText(input.value); } catch (e) { input.select(); document.execCommand && document.execCommand('copy'); } const o = btn.textContent; btn.textContent = L().copied; setTimeout(() => (btn.textContent = o), 1500); }
$('copyTeam').addEventListener('click', () => copy($('teamUrl'), $('copyTeam')));
$('dashCopy').addEventListener('click', () => copy($('dashUrl'), $('dashCopy')));
$('shareTeam').addEventListener('click', () => open(`https://wa.me/?text=${encodeURIComponent(L().teamShareText(st.pendingTeam, $('teamUrl').value))}`, '_blank', 'noopener'));
$('openTeam').addEventListener('click', () => { st.team = st.pendingTeam; setLang(st.lang); show('s-intro'); });

/* =================== QUESTIONS =================== */
$('start').addEventListener('click', () => {
  st.prenom = $('prenom').value.trim().replace(/\s+/g, ' ');
  st.i = 0; st.picks = []; st.uni = ''; st.order = L().questions.map(() => shuffle(ORDER));
  renderQ(); show('s-quiz');
});
function renderQ() {
  const Q = L().questions[st.i], n = L().questions.length;
  $('qn').textContent = L().qn(st.i + 1, n);
  $('bar').style.width = `${(st.i / n) * 100}%`;
  const ch = L().cheers[st.i]; $('cheer').textContent = ch || ''; $('cheer').classList.toggle('on', !!ch);
  $('q').textContent = Q.q;
  $('answers').innerHTML = st.order[st.i].map((k, j) => `<button class="ans ${st.picks[st.i] === k ? 'sel' : ''}" type="button" data-k="${k}"><b>${'ABCDE'[j]}</b>${Q.a[k]}</button>`).join('');
  $('back').style.visibility = st.i ? 'visible' : 'hidden';
}
$('answers').addEventListener('click', (e) => {
  const b = e.target.closest('.ans'); if (!b) return;
  st.picks[st.i] = b.dataset.k;

});
$('back').addEventListener('click', () => { if (st.i) { st.i--; renderQ(); } });

/* =================== UNIVERSITÉ (facultatif) =================== */
function renderUnis() {
  $('unis').innerHTML = [...UNIS, '__autre'].map((u) => `<button class="uni" type="button" data-u="${u}" aria-pressed="${st.uniSel === u}">${u === '__autre' ? L().uniOther : '🎓 ' + u}</button>`).join('');
  $('uniOther').style.display = st.uniSel === '__autre' ? 'block' : 'none';
}
$('unis').addEventListener('click', (e) => { const b = e.target.closest('.uni'); if (!b) return; st.uniSel = b.dataset.u; renderUnis(); if (st.uniSel === '__autre') $('uniOther').focus(); });
$('uniGo').addEventListener('click', () => { st.uni = st.uniSel === '__autre' ? $('uniOther').value.trim() : (st.uniSel || ''); finish(); });
$('uniSkip').addEventListener('click', () => { st.uni = ''; st.uniSel = ''; finish(); });
function finish() { show('s-wait'); setTimeout(() => { result(); confetti(); }, 1200); }

/* =================== RÉSULTAT =================== */
function scores() { const sc = Object.fromEntries(ORDER.map((k) => [k, 0])); st.picks.forEach((k) => sc[k]++); return sc; }
function ranking(sc) { return [...ORDER].sort((a, b) => sc[b] - sc[a] || ORDER.indexOf(a) - ORDER.indexOf(b)); }
function result(stay) {
  const sc = scores(), rk = ranking(sc), best = rk[0], second = sc[rk[1]] > 0 ? rk[1] : null;
  const P = L().profils[best];
  st.best = best; st.second = second; st.sc = sc;
  $('rk').textContent = L().yourProfile(st.prenom);
  $('remo').textContent = EMO[best]; $('remo').classList.remove('pop'); void $('remo').offsetWidth; if (!stay) $('remo').classList.add('pop');
  $('rname').textContent = P.name;
  $('rtrend').textContent = second ? L().trend(`${L().profils[second].short} ${EMO[second]}`) : L().pure(L().profils[best].short);
  $('rtag').textContent = P.tag;
  // coéquipier idéal
  const d = DUO[best];
  $('duoEmo').textContent = EMO[d]; $('duoName').textContent = L().profils[d].name; $('duoWhy').textContent = P.duoWhy;
  $('challenge').textContent = L().challenge(L().profils[d].short);
  // université
  $('uniCard').style.display = st.uni ? 'block' : 'none'; if (st.uni) $('uniLine').innerHTML = L().uniLine(st.uni.replace(/[<>&]/g, ''));
  if (stay && st.uniRank) showUniRank();
  // intervenant
  const s = SPEAKERS[SPEAKER[best]]; $('spkIni').textContent = s.ini; $('spkName').textContent = s.name; $('spkWhy').textContent = L().speakerWhy[SPEAKER[best]];
  $('rforces').innerHTML = P.forces.map((f) => `<span class="chip">${f}</span>`).join('');
  const tot = st.picks.length;
  $('rbars').innerHTML = rk.map((k) => `<div class="bar ${k === best ? 'me' : ''}"><span>${EMO[k]} ${L().profils[k].short}</span><div class="t"><div style="width:${(sc[k] / tot) * 100}%"></div></div><span class="v">${Math.round((sc[k] / tot) * 100)} %</span></div>`).join('');
  // équipe
  $('teamCard').style.display = st.team ? 'block' : 'none';
  if (st.team) $('teamCardTitle').textContent = L().teamCardTitle(st.team);
  if (!stay) { record(); uniRank(); }
  $('shareimg').alt = L().imgAlt;
  document.querySelectorAll('[data-fmt]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.fmt === st.fmt));
  drawCard(); if (!stay) show('s-result');
}
$('again').addEventListener('click', () => show('s-intro'));
document.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', () => { st.fmt = b.dataset.fmt; document.querySelectorAll('[data-fmt]').forEach((x) => x.setAttribute('aria-pressed', x === b)); drawCard(); }));
$('challenge').addEventListener('click', () => {
  const low = (n) => n.replace(/^Le /, 'le ').replace(/^L’/, 'l’').replace(/^The /, 'the ');
  const me = low(L().profils[st.best].name), duoFull = low(L().profils[DUO[st.best]].name), duo = L().profils[DUO[st.best]].short;
  open(`https://wa.me/?text=${encodeURIComponent(L().duoShare(me, duo, shareUrl(), duoFull))}`, '_blank', 'noopener');
});

async function uniRank() {
  if (!st.uni) return;
  try {
    await new Promise((r) => setTimeout(r, 800));          // laisse le temps d'enregistrer ce résultat
    const rows = await sbRpc('quiz_stats_universites');
    const i = rows.findIndex((x) => x.universite === st.uni);
    if (i >= 0) { st.uniRank = { pos: i + 1, n: rows[i].n }; showUniRank(); }
  } catch (e) { /* pas grave */ }
}
function showUniRank() { $('uniCardNote').textContent = L().uniRank(st.uni, st.uniRank.n, st.uniRank.pos); }

/* =================== CARTES (Story 1080×1920 · Publication 1080×1350) =================== */
function rr(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
function fit(c, text, weight, size, family, maxW, min) { let s = size; c.font = `${weight} ${s}px ${family}`; while (c.measureText(text).width > maxW && s > min) { s -= 2; c.font = `${weight} ${s}px ${family}`; } return s; }
function drawCard() {
  const story = st.fmt === 'story', W = 1080, H = story ? 1920 : 1350;
  const cv = $('cv'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), k = st.best, P = L().profils[k], C = L().card, BR = '"Bricolage Grotesque", sans-serif', DM = '"DM Sans", sans-serif';
  const g = c.createRadialGradient(W / 2, H * 0.2, 40, W / 2, H * 0.4, H * 0.85); g.addColorStop(0, '#2e6aa8'); g.addColorStop(.5, '#123056'); g.addColorStop(1, '#0a1f38');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.lineCap = 'round';
  for (let y = 0; y < H; y += 108) for (let x = 0; x < W; x += 108) {
    const q = 1.5; c.globalAlpha = .06; c.strokeStyle = '#fff'; c.lineWidth = 3 * q;
    c.beginPath(); c.moveTo(x + 28 * q, y + 18 * q); c.lineTo(x + 38 * q, y + 18 * q); c.arc(x + 38 * q, y + 30 * q, 12 * q, -Math.PI / 2, Math.PI / 2); c.lineTo(x + 30 * q, y + 42 * q); c.lineTo(x + 30 * q, y + 50 * q); c.stroke();
    c.globalAlpha = .18; c.fillStyle = '#7AC142'; c.beginPath(); c.arc(x + 46 * q, y + 22 * q, 4 * q, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  const Y = story ? { brand: 150, kick: 300, emo: 560, name: 740, trend: 815, chips: 880, bars: 1040, duo: 1320, spk: 1490, uni: 1560, cta: 1660, url: 1800, date: 1850 }
                  : { brand: 110, kick: 210, emo: 420, name: 580, trend: 645, chips: 690, bars: 820, duo: 1045, spk: null, uni: null, cta: 1120, url: 1275, date: 1316 };
  const hg = c.createRadialGradient(W / 2, Y.emo - 60, 10, W / 2, Y.emo - 60, 400); hg.addColorStop(0, COLOR[k] + '66'); hg.addColorStop(1, COLOR[k] + '00');
  c.fillStyle = hg; c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#fff'; c.globalAlpha = .9; c.font = `800 34px ${BR}`; c.fillText('BWAT SEKRÈM TALKS', W / 2, Y.brand); c.globalAlpha = 1;
  c.fillStyle = '#7AC142'; c.font = `700 30px ${DM}`; c.fillText(C.kicker(st.prenom), W / 2, Y.kick);
  c.font = `${story ? 200 : 170}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.fillText(EMO[k], W / 2, Y.emo);
  c.fillStyle = '#fff'; const nm = P.name.toUpperCase(); fit(c, nm, 800, story ? 130 : 120, BR, W - 120, 56); c.fillText(nm, W / 2, Y.name);
  const tr = st.second ? C.trend(L().profils[st.second].short) + ' ' + EMO[st.second] : C.pure(L().profils[k].short);
  c.fillStyle = '#7AC142'; fit(c, tr, 700, 34, DM, W - 160, 22); c.fillText(tr, W / 2, Y.trend);
  // forces
  let cfs = 32; c.font = `700 ${cfs}px ${DM}`; const gap = 14, pad = 26;
  let ws = P.forces.map((t) => c.measureText(t).width + pad * 2), tw = ws.reduce((a, b) => a + b, 0) + gap * 2;
  while (tw > W - 80 && cfs > 22) { cfs -= 2; c.font = `700 ${cfs}px ${DM}`; ws = P.forces.map((t) => c.measureText(t).width + pad * 2); tw = ws.reduce((a, b) => a + b, 0) + gap * 2; }
  let x = (W - tw) / 2;
  P.forces.forEach((t, i) => { c.fillStyle = 'rgba(255,255,255,.12)'; rr(c, x, Y.chips, ws[i], 60, 30); c.fill(); c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(t, x + pad, Y.chips + 41); x += ws[i] + gap; });
  c.textAlign = 'center';
  // barres
  const sc = st.sc, tot = st.picks.length, bx = 220, bw = 640; let by = Y.bars;
  ranking(sc).slice(0, 3).forEach((kk) => {
    const pct = sc[kk] / tot; c.textAlign = 'left'; c.fillStyle = 'rgba(255,255,255,.85)'; c.font = `700 28px ${DM}`; c.fillText(`${EMO[kk]}  ${L().profils[kk].short}`, bx, by);
    c.textAlign = 'right'; c.fillText(`${Math.round(pct * 100)} %`, bx + bw, by);
    c.fillStyle = 'rgba(255,255,255,.14)'; rr(c, bx, by + 14, bw, 14, 7); c.fill();
    c.fillStyle = kk === k ? '#7AC142' : 'rgba(255,255,255,.55)'; rr(c, bx, by + 14, Math.max(14, bw * pct), 14, 7); c.fill();
    by += story ? 84 : 72;
  });
  c.textAlign = 'center';
  // coéquipier idéal
  const d = DUO[k], duoTxt = C.duo(EMO[d], L().profils[d].short);
  c.fillStyle = 'rgba(255,255,255,.1)'; rr(c, 90, Y.duo - 52, W - 180, 84, 42); c.fill();
  c.fillStyle = '#fff'; fit(c, duoTxt, 700, 32, DM, W - 240, 22); c.fillText(duoTxt, W / 2, Y.duo + 2);
  if (story) {
    const s = SPEAKERS[SPEAKER[k]]; c.fillStyle = 'rgba(255,255,255,.8)'; fit(c, C.speaker(s.name), 500, 30, DM, W - 160, 22); c.fillText(C.speaker(s.name), W / 2, Y.spk);
    if (st.uni) { const ut = `🎓 ${st.uni}`; c.fillStyle = '#7AC142'; fit(c, ut, 800, 34, DM, W - 200, 22); c.fillText(ut, W / 2, Y.uni); }
  }
  // appel à l'action
  c.fillStyle = '#7AC142'; rr(c, 130, Y.cta, 820, 96, 48); c.fill();
  c.fillStyle = '#0E2A4A'; fit(c, C.cta, 800, 40, BR, 760, 28); c.fillText(C.cta, W / 2, Y.cta + 62);
  c.fillStyle = '#fff'; c.font = `700 30px ${DM}`; c.fillText(SITE, W / 2, Y.url);
  c.globalAlpha = .7; c.font = `500 24px ${DM}`; c.fillText(C.date, W / 2, Y.date); c.globalAlpha = 1;
  $('shareimg').src = cv.toDataURL('image/jpeg', .92);
  $('shareimg').classList.toggle('story', story);
}
const blob = () => new Promise((r) => $('cv').toBlob(r, 'image/jpeg', .92));
$('share').addEventListener('click', async () => {
  const text = L().shareText(L().profils[st.best].name, EMO[st.best], shareUrl());
  const f = new File([await blob()], L().file, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], text }); } catch (e) {} }
  else open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
});
$('dl').addEventListener('click', async () => {
  const u = URL.createObjectURL(await blob()); const a = document.createElement('a'); a.href = u; a.download = L().file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
});

/* =================== TABLEAU D'ÉQUIPE (données réelles, totaux anonymes) =================== */
async function renderDash() {
  $('dashTitle').textContent = L().dashTitle(st.team); $('dashLead').textContent = '…';
  $('dashUrl').value = shareUrl({ equipe: st.team });
  $('dashBars').innerHTML = ''; $('dashInsight').textContent = '';
  let rows = [];
  try { await new Promise((r) => setTimeout(r, st.recorded ? 0 : 900)); rows = await sbRpc('quiz_stats_equipe', { p_equipe: st.team }); }
  catch (e) { $('dashLead').textContent = L().dashError; return; }
  const counts = Object.fromEntries(ORDER.map((k) => [k, 0])); rows.forEach((r) => { counts[r.profil] = r.n; });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  $('dashLead').textContent = L().dashLead(total);
  $('dashBars').innerHTML = ranking(counts).map((k) => `<div class="bar ${k === st.best ? 'me' : ''}"><span>${EMO[k]} ${L().profils[k].short}</span><div class="t"><div style="width:${total ? (counts[k] / total) * 100 : 0}%"></div></div><span class="v">${counts[k]}</span></div>`).join('');
  const missing = ORDER.filter((k) => !counts[k]);
  $('dashInsight').textContent = total < 3 ? L().dashFew : missing.length ? L().dashMissing(missing.map((k) => L().profils[k].short)) : L().dashBalanced;
}
$('toDash').addEventListener('click', () => { renderDash(); show('s-team'); });
$('dashBack').addEventListener('click', () => show('s-result'));

/* =================== CONFETTIS =================== */
function confetti() {
  const cv = $('confetti'), c = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#7AC142', '#FFB547', '#5EC8F2', '#ffffff', '#B79CFF', COLOR[st.best]];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: Math.random() * 8 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0] }));
  let t = 0;
  (function f() {
    c.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.globalAlpha = Math.max(0, 1 - t / 140); c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore(); });
    if (++t < 140) requestAnimationFrame(f); else c.clearRect(0, 0, cv.width, cv.height);
  })();
}

(() => {
  const q = params.get('lang');
  let saved = null; try { saved = localStorage.getItem('bst_quiz_lang'); } catch (e) {}
  const nav = (navigator.language || 'fr').slice(0, 2);
